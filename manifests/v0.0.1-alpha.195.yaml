    # v0.0.1-alpha.195
    
    ## English
    
    ### Fixed
    
    - Fixed releases not updating the Cloudflare-backed image registry proxy; each release now deploys the current Worker policy and rejects stale image digests.
    
    ### Documentation
    
    - Documented the verified recovery status for the previous release.
    
    Full Changelog: https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.192...v0.0.1-alpha.195
    
    ## 简体中文
    
    ### 修复
    
    - 修复版本发布后未更新 Cloudflare 镜像仓库代理的问题；现在每个版本都会部署当前 Worker 策略，并拒绝过期的镜像摘要。
    
    ### 文档
    
    - 补充记录上一版本已验证的恢复状态。
    
    完整变更记录：https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.192...v0.0.1-alpha.195
