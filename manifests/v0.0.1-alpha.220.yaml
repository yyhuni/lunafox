  body: |
    # v0.0.1-alpha.220
    
    ## English
    
    ### Added
    
    - Target lists and organization target lists can filter by whether a target has completed a successful scan. Editing a scheduled scan opens its side panel directly, and column sort menus match the height of their header control.
    
    Full Changelog: https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.219...v0.0.1-alpha.220
    
    ## 简体中文
    
    ### 新增
    
    - 目标列表和组织内的目标列表可以按目标是否已完成一次成功扫描进行筛选。编辑定时扫描会直接打开侧边栏，列表排序菜单的行高与表头控件一致。
    
    完整变更记录：https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.219...v0.0.1-alpha.220
