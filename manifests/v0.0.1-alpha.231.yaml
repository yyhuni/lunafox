  body: |
    # v0.0.1-alpha.231
    
    ## English
    
    ### Added
    
    - Added optional recursive subdomain brute-force discovery to Subdomain Discovery. It reuses the existing PureDNS pipeline, supports up to five additional layers, and preserves deterministic serial execution with fail-fast handling.
    
    Full Changelog: https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.230...v0.0.1-alpha.231
    
    ## 简体中文
    
    ### 新增
    
    - 为子域名发现新增可选的递归爆破能力。该功能复用现有 PureDNS 流程，支持最多五层额外递归，并保持确定性的串行执行和失败即停处理。
    
    完整变更记录：https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.230...v0.0.1-alpha.231
