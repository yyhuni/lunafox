  body: |
    # v0.0.1-alpha.197
    
    ## English
    
    ### Fixed
    
    - Fixed fresh installations failing during image preheating: Docker Hub official images such as PostgreSQL and Redis were rejected by an over-strict digest check, and accelerated installations aborted on registry referrer probes; both documented installation paths now complete.
    
    Full Changelog: https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.196...v0.0.1-alpha.197
    
    ## 简体中文
    
    ### 修复
    
    - 修复全新安装时镜像预热失败的问题：Docker Hub 官方镜像（如 PostgreSQL、Redis）此前被过严的摘要校验拒绝，加速安装也会因镜像仓库 referrer 探测被拒而中断；两条文档安装路径现在均可正常完成。
    
    完整变更记录：https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.196...v0.0.1-alpha.197
