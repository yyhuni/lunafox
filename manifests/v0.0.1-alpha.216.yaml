    # v0.0.1-alpha.216
    
    ## English
    
    ### Improved
    
    - Scheduled Scan handoff failures now include more diagnostic context in Server logs while keeping public failure summaries safe and bounded.
    
    ### Documentation
    
    - Documented optional database time zone and connection pool settings in the Compose configuration reference, including their defaults and first-start behavior.
    
    Full Changelog: https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.215...v0.0.1-alpha.216
    
    ## 简体中文
    
    ### 改进
    
    - Scheduled Scan 交接失败现在会在 Server 日志中记录更完整的诊断上下文，同时保持公开失败摘要安全且有界。
    
    ### 文档
    
    - 在 Compose 配置参考中补充了可选的数据库时区和连接池设置，包括默认值及首次启动后的行为。
    
    完整变更记录：https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.215...v0.0.1-alpha.216
