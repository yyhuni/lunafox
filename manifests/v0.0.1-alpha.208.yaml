    # v0.0.1-alpha.208
    
    ## English
    
    ### Improved
    
    - The system upgrade page now uses one centered status view. It shows the current stage, the host action in progress, diagnostics when the upgrade needs attention, and the confirmed upgrade events.
    
    Full Changelog: https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.207...v0.0.1-alpha.208
    
    ## 简体中文
    
    ### 改进
    
    - 系统升级页面现在使用居中的单一状态视图，展示当前阶段、正在进行的宿主动作、需要处理时的诊断信息，以及已确认的升级事件。
    
    完整变更记录：https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.207...v0.0.1-alpha.208
