version: v1
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    # The repository's boundary contract rules prioritize Google AIP and
    # protocol-native RPC shapes over Buf's RPCNameRequest/RPCNameResponse
    # wrapper naming convention.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
