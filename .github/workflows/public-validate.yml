    # needs: public-engine-runtime-aggregate, public-engine-package-publish
    name: Publish Public Engine Release Manifest
    needs: [publication-intent, public-engine-runtime-discover, public-engine-runtime-aggregate, public-engine-package-publish, resolve-public-runtime-composition]
    runs-on: ubuntu-22.04
    permissions:
