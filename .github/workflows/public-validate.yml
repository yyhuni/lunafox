      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-image-evidence-frontend-${{ github.sha }}
          path: dist/final/runtime/frontend
      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-image-evidence-nginx-${{ github.sha }}
          path: dist/final/runtime/nginx
      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-image-evidence-agent-${{ github.sha }}
          path: dist/final/runtime/agent
      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-image-evidence-bootstrap-${{ github.sha }}
          path: dist/final/runtime/bootstrap
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-release
          path: dist/final/engine
      - uses: oras-project/setup-oras@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-oci-publish/go.mod
          cache-dependency-path: |
            tools/engine-oci-publish/go.sum
            contracts/go.sum
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.LUNAFOX_PUBLIC_DOCKERHUB_USERNAME }}
          password: ${{ secrets.LUNAFOX_PUBLIC_DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: source
        name: Bind the final release to the generated public merge
        run: |
          set -euo pipefail
          test -f PUBLIC_PROVENANCE.json
          test "$(jq -er '.generatedReadOnly' PUBLIC_PROVENANCE.json)" = true
          test "$(jq -er '.sourceRepository' PUBLIC_PROVENANCE.json)" = "$PRIVATE_REPOSITORY"
          test "$(jq -er '.destinationRepository' PUBLIC_PROVENANCE.json)" = "$PUBLIC_REPOSITORY"
          release_tag="$(jq -er '.releaseTag' PUBLIC_PROVENANCE.json)"
          source_revision_digest="$(jq -er '.sourceRevisionDigest' PUBLIC_PROVENANCE.json)"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          [[ "$source_revision_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "release_tag=$release_tag"
            echo "source_revision_digest=$source_revision_digest"
            echo "export_manifest_sha256=sha256:$(sha256sum PUBLIC_EXPORT_MANIFEST.json | awk '{print $1}')"
            echo "public_provenance_sha256=sha256:$(sha256sum PUBLIC_PROVENANCE.json | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: Validate release notes for final publication
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/final
          node scripts/ci/validate-public-release-notes.mjs \
            --root-dir "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --json \
            | tee dist/final/release-notes-validation.json
      - name: Validate bilingual public documentation for final publication
        run: |
          set -euo pipefail
          node scripts/ci/validate-public-documentation.mjs \
            --root-dir "$GITHUB_WORKSPACE" --json \
            | tee dist/final/documentation-validation.json
      - name: Verify every Runtime image evidence record
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_REVISION_DIGEST: ${{ steps.source.outputs.source_revision_digest }}
          EXPORT_MANIFEST_SHA256: ${{ steps.source.outputs.export_manifest_sha256 }}
          PUBLIC_PROVENANCE_SHA256: ${{ steps.source.outputs.public_provenance_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist/final/runtime-verification dist/final/runtime-evidence
          plan="dist/final/composition-plan/runtime-composition-plan.json"
          test -f "$plan"
          for component in server frontend nginx agent bootstrap; do
            evidence_file="$(find "dist/final/runtime/$component" -type f -name "public-runtime-image-evidence-${component}.json" -print -quit)"
            [ -n "$evidence_file" ] || { echo "missing Runtime evidence: $component" >&2; exit 1; }
            cp "$evidence_file" "dist/final/runtime-evidence/public-runtime-image-evidence-${component}.json"
            component_id="runtime.$component"
            disposition="$(jq -er --arg id "$component_id" '.components[] | select(.id == $id) | .disposition' "$plan")"
            if [ "$disposition" = reused ]; then
              jq -e --arg id "$component_id" --slurpfile plan "$plan" '
                ($plan[0].components[] | select(.id == $id and .disposition == "reused")) as $planned |
                select(
                  (keys | sort) == ["artifact", "component", "copiedWithoutRebuild", "evidence", "kind", "schemaVersion", "sourceRelease"] and
                  .schemaVersion == 1 and
                  .kind == "lunafox.component-promotion-receipt.v1" and
                  .component == $id and
                  .copiedWithoutRebuild == true and
                  .artifact == $planned.artifact and
                  .evidence == $planned.evidence and
                  .sourceRelease == $planned.sourceRelease
                ) |
                {schemaVersion: 1, passed: true, component: $id, disposition: "reused", artifact: $planned.artifact, sourceRelease: $planned.sourceRelease}
              ' "$evidence_file" > "dist/final/runtime-verification/${component}.json"
              continue
            fi
            [ "$disposition" = built ] || { echo "invalid Runtime composition disposition: $component" >&2; exit 1; }
            case "$component" in
              server) dockerfile=server/Dockerfile; lockfile= ;;
              frontend) dockerfile=frontend/Dockerfile; lockfile=frontend/pnpm-lock.yaml ;;
              nginx) dockerfile=docker/nginx/Dockerfile; lockfile= ;;
              agent) dockerfile=docker/agent/Dockerfile; lockfile= ;;
              bootstrap) dockerfile=docker/bootstrap/Dockerfile; lockfile= ;;
            esac
            args=(
              --evidence "$evidence_file" --component "$component" --tag "$RELEASE_TAG"
              --source-revision-digest "$SOURCE_REVISION_DIGEST" --public-merge-commit "$GITHUB_SHA"
              --workflow-run-id "$GITHUB_RUN_ID" --export-manifest-sha256 "$EXPORT_MANIFEST_SHA256"
              --public-provenance-sha256 "$PUBLIC_PROVENANCE_SHA256"
              --dockerfile-sha256 "sha256:$(sha256sum "$dockerfile" | awk '{print $1}')" --json
            )
            if [ -n "$lockfile" ]; then
              args+=(--lockfile-sha256 "sha256:$(sha256sum "$lockfile" | awk '{print $1}')")
            fi
            node scripts/ci/verify-public-runtime-image-evidence.mjs "${args[@]}" \
              > "dist/final/runtime-verification/${component}.json"
          done
      - id: composition
        name: Finalize the canonical runtime composition core
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_REVISION_DIGEST: ${{ steps.source.outputs.source_revision_digest }}
        run: |
          set -euo pipefail
          plan="dist/final/composition-plan/runtime-composition-plan.json"
          test -f "$plan"
          composition_args=(
            --mode final
            --release-tag "$RELEASE_TAG"
            --source-revision-digest "$SOURCE_REVISION_DIGEST"
            --public-merge-commit "$GITHUB_SHA"
            --plan "$plan"
            --runtime-evidence-dir dist/final/runtime-evidence
            --output dist/final/runtime-composition.core.json
          )
          if [ -f dist/final/engine/runtime-evidence.json ] || [ -f dist/final/engine/package-evidence.json ]; then
            [ -f dist/final/engine/runtime-evidence.json ] && [ -f dist/final/engine/package-evidence.json ] || { echo "Engine Runtime/Package evidence must be paired" >&2; exit 1; }
            composition_args+=(
              --engine-runtime-evidence dist/final/engine/runtime-evidence.json
              --engine-package-evidence dist/final/engine/package-evidence.json
            )
          fi
          node scripts/ci/resolve-public-runtime-composition.mjs "${composition_args[@]}" \
            --json | tee dist/final/runtime-composition-finalization.json
          composition_digest="$(jq -er '.compositionDigest' dist/final/runtime-composition.core.json)"
          [[ "$composition_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "invalid runtime composition canonical digest" >&2
            exit 1
          }
          echo "composition_digest=$composition_digest" >> "$GITHUB_OUTPUT"
      - name: Verify the independent Engine handoff
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_REVISION_DIGEST: ${{ steps.source.outputs.source_revision_digest }}
          EXPORT_MANIFEST_SHA256: ${{ steps.source.outputs.export_manifest_sha256 }}
          PUBLIC_PROVENANCE_SHA256: ${{ steps.source.outputs.public_provenance_sha256 }}
        run: |
          set -euo pipefail
          engine_args=(
            --complete-manifest dist/final/engine/manifest.json
            --tag "$RELEASE_TAG" --public-merge-commit "$GITHUB_SHA"
            --source-revision-digest "$SOURCE_REVISION_DIGEST"
            --export-manifest-sha256 "$EXPORT_MANIFEST_SHA256"
            --public-provenance-sha256 "$PUBLIC_PROVENANCE_SHA256"
            --workflow-identity "https://github.com/yyhuni/lunafox/.github/workflows/public-validate.yml@refs/heads/main"
            --composition-plan dist/final/composition-plan/runtime-composition-plan.json
            --composition dist/final/runtime-composition.core.json
          )
          if [ -f dist/final/engine/runtime-build-results.json ]; then
            engine_args+=(
              --manifest dist/final/engine/current-build-manifest.json
              --runtime-build-results dist/final/engine/runtime-build-results.json
              --package-build-results dist/final/engine/package-build-results.json
              --package-digests-dir dist/final/engine/public-engine-package-digests
              --runtime-evidence dist/final/engine/runtime-evidence.json
              --package-evidence dist/final/engine/package-evidence.json
            )
          fi
          node scripts/ci/verify-public-engine-release.mjs "${engine_args[@]}" \
            --json | tee dist/final/engine-verification.json
      - name: Promote every Runtime digest to both final registries
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/final/runtime-digests
          components=(server frontend nginx agent bootstrap)
          resolve_digest() {
            oras manifest fetch --descriptor "$1" 2>/dev/null | jq -r '.digest // empty' || true
          }
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          plan="dist/final/composition-plan/runtime-composition-plan.json"
          test -f "$plan"
          for component in "${components[@]}"; do
            evidence="dist/final/runtime-evidence/public-runtime-image-evidence-${component}.json"
            component_id="runtime.$component"
            disposition="$(jq -er --arg id "$component_id" '.components[] | select(.id == $id) | .disposition' "$plan")"
            expected_digest="$(jq -er '.digest // empty' "$evidence")"
            expected_ref="$(jq -er '.image // empty' "$evidence")"
            if [ "$disposition" = reused ]; then
              expected_digest="$(jq -er --arg id "$component_id" '.components[] | select(.id == $id and .disposition == "reused") | .artifact.digest' "$plan")"
              expected_ref="$(jq -er --arg id "$component_id" '.components[] | select(.id == $id and .disposition == "reused") | .artifact.ref' "$plan")"
            elif [ "$disposition" != built ]; then
              echo "invalid Runtime composition disposition: $component" >&2
              exit 1
            fi
            [[ "$expected_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "invalid Runtime digest: $component" >&2; exit 1; }
            ghcr_ref="ghcr.io/yyhuni/lunafox-${component}@${expected_digest}"
            [ "$expected_ref" = "$ghcr_ref" ] || { echo "Runtime evidence artifact does not match the planned immutable reference: $component" >&2; exit 1; }
            docker_target="docker.io/yyhuni/lunafox-${component}:${RELEASE_TAG}"
            ghcr_target="ghcr.io/yyhuni/lunafox-${component}:${RELEASE_TAG}"
            docker_existing="$(resolve_digest "$docker_target")"
            ghcr_existing="$(resolve_digest "$ghcr_target")"
            if [ -n "$docker_existing" ] && [ -n "$ghcr_existing" ] && [ "$docker_existing" != "$ghcr_existing" ]; then
              echo "final tag cross-registry drift: $component" >&2
              exit 1
            fi
            existing_digest="${ghcr_existing:-$docker_existing}"
            digest="$expected_digest"
            source_ref="$expected_ref"
            reused_final_tag=false
            if [ -n "$existing_digest" ] && [ "$existing_digest" != "$expected_digest" ]; then
              existing_target="$ghcr_target"
              [ -n "$ghcr_existing" ] || existing_target="$docker_target"
              existing_location="${existing_target%:*}"
              existing_ref="${existing_location}@${existing_digest}"
              # A later workflow-only maintenance merge must not replace a
              # versioned release tag. Reuse it only after anonymous trust
              # verification against the canonical public workflow identity.
              DOCKER_CONFIG="$anonymous_config" cosign verify \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity-regexp "^https://github\\.com/yyhuni/lunafox/\\.github/workflows/public-validate\\.yml@refs/heads/main$" \
                "$existing_ref" >/dev/null
              digest="$existing_digest"
              source_ref="$existing_ref"
              reused_final_tag=true
            fi
            printf 'COMPONENT=%s\nDIGEST=%s\nEXPECTED_BUILD_DIGEST=%s\nREUSED_FINAL_TAG=%s\nSOURCE_REF=%s\nGHCR_REF=%s\nDOCKERHUB_REF=%s\n' "$component" "$digest" "$expected_digest" "$reused_final_tag" "$source_ref" "ghcr.io/yyhuni/lunafox-${component}@${digest}" "docker.io/yyhuni/lunafox-${component}@${digest}" > "dist/final/runtime-digests/${component}.env"
            oras manifest fetch --descriptor "$source_ref" >/dev/null
          done
          for component in "${components[@]}"; do
            source_ref="$(awk -F= '$1 == "SOURCE_REF" {print $2}' "dist/final/runtime-digests/${component}.env")"
            digest="$(awk -F= '$1 == "DIGEST" {print $2}' "dist/final/runtime-digests/${component}.env")"
            for registry in docker.io ghcr.io; do
              target="${registry}/yyhuni/lunafox-${component}:${RELEASE_TAG}"
              existing="$(oras manifest fetch --descriptor "$target" 2>/dev/null | jq -r '.digest // empty' || true)"
              if [ -n "$existing" ] && [ "$existing" != "$digest" ]; then
                echo "final tag already points to a different digest: $target" >&2
                exit 1
              fi
              if [ -z "$existing" ]; then
                oras cp "$source_ref" "$target"
              fi
              actual="$(oras manifest fetch --descriptor "$target" | jq -er '.digest')"
              [ "$actual" = "$digest" ] || { echo "cross-registry promotion drift: $target" >&2; exit 1; }
            done
          done
      - name: Sign and verify final Runtime OCI manifests
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          (cd tools/engine-oci-publish && go build -o "$RUNNER_TEMP/verify-oci-signature" ./cmd/verify-signature)
          mkdir -p dist/final/signatures
          plan="dist/final/composition-plan/runtime-composition-plan.json"
          test -f "$plan"
          for file in dist/final/runtime-digests/*.env; do
            component="$(awk -F= '$1 == "COMPONENT" {print $2}' "$file")"
            digest="$(awk -F= '$1 == "DIGEST" {print $2}' "$file")"
            disposition="$(jq -er --arg id "runtime.$component" '.components[] | select(.id == $id) | .disposition' "$plan")"
            [ "$disposition" = built ] || [ "$disposition" = reused ] || {
              echo "invalid Runtime composition disposition: $component" >&2
              exit 1
            }
            for registry in docker.io ghcr.io; do
              ref="${registry}/yyhuni/lunafox-${component}@${digest}"
              if [ "$disposition" = built ]; then
                cosign sign --yes "$ref"
              fi
              "$RUNNER_TEMP/verify-oci-signature" "$ref"
              DOCKER_CONFIG="$anonymous_config" cosign verify \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity-regexp '^https://github\.com/yyhuni/lunafox/\.github/workflows/public-validate\.yml@refs/heads/main$' \
                "$ref" > "dist/final/signatures/${component}-${registry//./_}.json"
              jq -e 'type == "array" and length > 0' "dist/final/signatures/${component}-${registry//./_}.json" >/dev/null
            done
          done
      - name: Generate and verify the complete release manifest
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          RUNTIME_COMPOSITION_SHA256: ${{ steps.composition.outputs.composition_digest }}
        run: |
          set -euo pipefail
          mkdir -p dist/final
          release_version="${RELEASE_TAG#v}"
          refs_for() { awk -F= '$1 == "DOCKERHUB_REF" {docker=$2} $1 == "GHCR_REF" {ghcr=$2} END {print docker "," ghcr}' "dist/final/runtime-digests/$1.env"; }
          RELEASE_VERSION="$release_version" \
          RUNTIME_SERVER_REFS="$(refs_for server)" \
          RUNTIME_FRONTEND_REFS="$(refs_for frontend)" \
          RUNTIME_NGINX_REFS="$(refs_for nginx)" \
          RUNTIME_AGENT_REFS="$(refs_for agent)" \
          RUNTIME_BOOTSTRAP_REFS="$(refs_for bootstrap)" \
          bash scripts/ci/generate-release-manifest.sh \
            --engine-ref-dir dist/final/engine/public-engine-package-digests \
            --final-runtime-contract --verify-contract \
            --output dist/final/release.manifest.yaml
          node scripts/ci/verify-public-release.mjs \
            --manifest dist/final/release.manifest.yaml --tag "$RELEASE_TAG" --json \
            > dist/final/release-verification.json
          manifest_digest="sha256:$(sha256sum dist/final/release.manifest.yaml | awk '{print $1}')"
          node scripts/ci/resolve-public-runtime-composition.mjs \
            --mode bind \
            --plan dist/final/runtime-composition.core.json \
            --manifest-digest "$manifest_digest" \
            --output dist/final/runtime-composition.json \
            --json | tee dist/final/runtime-composition-binding.json
          node scripts/ci/verify-release-component-composition.mjs \
            --composition dist/final/runtime-composition.json \
            --manifest dist/final/release.manifest.yaml --json \
            > dist/final/runtime-composition-verification.json
      - name: Assemble and verify durable component evidence
        run: |
          set -euo pipefail
          args=(
            --composition dist/final/runtime-composition.json
            --runtime-evidence-dir dist/final/runtime-evidence
            --output dist/final/component-evidence.json
          )
          if [ -f dist/final/engine/runtime-evidence.json ]; then
            args+=(--engine-runtime-evidence dist/final/engine/runtime-evidence.json)
          fi
          if [ -f dist/final/engine/package-evidence.json ]; then
            args+=(--engine-package-evidence dist/final/engine/package-evidence.json)
          fi
          if [ -f dist/final/composition-plan/previous.component-evidence.json ]; then
            args+=(--previous-bundle dist/final/composition-plan/previous.component-evidence.json)
          fi
          node scripts/ci/build-component-evidence-bundle.mjs "${args[@]}" --json \
            | tee dist/final/component-evidence-build.json
          node scripts/ci/verify-component-evidence-bundle.mjs \
            --bundle dist/final/component-evidence.json \
            --composition dist/final/runtime-composition.json \
            --manifest dist/final/release.manifest.yaml --json \
            | tee dist/final/component-evidence-verification.json
      - name: Build immutable Docker Compose deployment packages
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          node --test scripts/ci/generate-compose-deployment.test.mjs
          node scripts/ci/generate-compose-deployment.mjs \
            --manifest dist/final/release.manifest.yaml --tag "$RELEASE_TAG" \
            --runtime-composition dist/final/runtime-composition.json \
            --output dist/final/deployment --snapshot dist/final/deployment-snapshot \
            > dist/final/deployment-packages.json
          [ "$(jq 'length' dist/final/deployment-packages.json)" -eq 1 ]
          [ "$(jq -r '.[0].name' dist/final/deployment-packages.json)" = "lunafox-${RELEASE_TAG}.zip" ]
          jq -r '.[] | [.name,.sha256] | @tsv' dist/final/deployment-packages.json |
            while IFS=$'\t' read -r name expected; do
              file="dist/final/deployment/$name"
              [ -f "$file" ]
              actual="$(sha256sum "$file" | awk '{print $1}')"
              [ "$actual" = "$expected" ]
              unzip -t "$file" >/dev/null
            done
      - id: deployment
        name: Publish and verify the protected deployment snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/ci/publish-public-deployment.mjs \
            --snapshot-dir dist/final/deployment-snapshot \
            --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA" \
            --timeout-seconds 10800 --json | tee dist/final/deployment-publication.json
          merge_sha="$(jq -er '.mergeSha' dist/final/deployment-publication.json)"
          [[ "$merge_sha" =~ ^[a-f0-9]{40}$ ]] || { echo "deployment merge SHA is invalid" >&2; exit 1; }
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Generate the immutable release provenance record
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_REVISION_DIGEST: ${{ steps.source.outputs.source_revision_digest }}
          EXPORT_MANIFEST_SHA256: ${{ steps.source.outputs.export_manifest_sha256 }}
          PUBLIC_PROVENANCE_SHA256: ${{ steps.source.outputs.public_provenance_sha256 }}
          DEPLOYMENT_SNAPSHOT_COMMIT: ${{ steps.deployment.outputs.merge_sha }}
        run: |
          set -euo pipefail
          manifest_digest="sha256:$(sha256sum dist/final/release.manifest.yaml | awk '{print $1}')"
          runtime_composition_digest="$(jq -er '.compositionDigest' dist/final/runtime-composition.json)"
          runtime_composition_asset_sha256="sha256:$(sha256sum dist/final/runtime-composition.json | awk '{print $1}')"
          component_evidence_asset_sha256="sha256:$(sha256sum dist/final/component-evidence.json | awk '{print $1}')"
          jq -n \
            --arg artifactDigest "$manifest_digest" \
            --arg runtimeCompositionDigest "$runtime_composition_digest" \
            --arg runtimeCompositionAssetSha256 "$runtime_composition_asset_sha256" \
            --arg componentEvidenceAssetSha256 "$component_evidence_asset_sha256" \
            --arg privateSourceRevision "$SOURCE_REVISION_DIGEST" \
            --arg workflowIdentity "https://github.com/yyhuni/lunafox/.github/workflows/public-validate.yml@refs/heads/main" \
            --arg builderRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg exportManifest "$EXPORT_MANIFEST_SHA256" \
            --arg publicProvenance "$PUBLIC_PROVENANCE_SHA256" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg publicSourceCommit "$GITHUB_SHA" \
            --arg deploymentSnapshotCommit "$DEPLOYMENT_SNAPSHOT_COMMIT" \
            '{schemaVersion:1,status:"published",releaseTag:$releaseTag,artifactDigest:$artifactDigest,runtimeComposition:{asset:"runtime-composition.json",digest:$runtimeCompositionDigest,assetSha256:$runtimeCompositionAssetSha256},componentEvidence:{asset:"component-evidence.json",assetSha256:$componentEvidenceAssetSha256},privateSourceRevision:$privateSourceRevision,publicSourceCommit:$publicSourceCommit,deploymentSnapshotCommit:$deploymentSnapshotCommit,workflowIdentity:$workflowIdentity,builderRun:$builderRun,exportManifest:$exportManifest,publicProvenance:$publicProvenance,sbom:true,scanEvidence:{runtimeImages:true,engineHandoff:true,signatures:true}}' \
            > dist/final/public-release-provenance.json
      - name: Verify the complete release evidence closure
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/ci/verify-public-release-evidence.mjs \
            --manifest dist/final/release.manifest.yaml \
            --composition dist/final/runtime-composition.json \
            --bundle dist/final/component-evidence.json \
            --provenance dist/final/public-release-provenance.json \
            --tag "$RELEASE_TAG" --json \
            | tee dist/final/public-release-evidence-verification.json
      - name: Generate and publish the release-channel branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          channel="canary"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && channel=stable
          channel_root="$GITHUB_WORKSPACE/dist/final/channel"
          rm -rf "$channel_root"
          mkdir -p "$channel_root/channels" "$channel_root/manifests"
          channel_worktree="$(mktemp -d)"
          cleanup() { rm -rf "$channel_worktree"; }
          trap cleanup EXIT
          if git clone --depth 1 --branch release-channel "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPOSITORY}.git" "$channel_worktree" 2>/dev/null; then
            :
          else
            rm -rf "$channel_worktree"
            mkdir -p "$channel_worktree"
            git -C "$channel_worktree" init
            git -C "$channel_worktree" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPOSITORY}.git"
            git -C "$channel_worktree" checkout --orphan release-channel
          fi
          if [ -d "$channel_worktree/channels" ]; then cp -a "$channel_worktree/channels/." "$channel_root/channels/"; fi
          if [ -d "$channel_worktree/manifests" ]; then cp -a "$channel_worktree/manifests/." "$channel_root/manifests/"; fi
          node scripts/ci/generate-public-channel.mjs \
            --tag "$RELEASE_TAG" --channel "$channel" --manifest dist/final/release.manifest.yaml \
            --runtime-composition dist/final/runtime-composition.json \
            --output-dir "$channel_root" --publication-complete
          # The first successful publication can follow the frozen source
          # first tag, so do not manufacture a historical channel record.
          node scripts/ci/check-public-channel.mjs --root-dir "$channel_root"
          rm -rf "$channel_worktree/channels" "$channel_worktree/manifests"
          mkdir -p "$channel_worktree/channels" "$channel_worktree/manifests"
          cp -a "$channel_root/channels/." "$channel_worktree/channels/"
          cp -a "$channel_root/manifests/." "$channel_worktree/manifests/"
          git -C "$channel_worktree" config user.name "github-actions[bot]"
          git -C "$channel_worktree" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$channel_worktree" add channels manifests
          if ! git -C "$channel_worktree" diff --cached --quiet; then
            git -C "$channel_worktree" commit -m "chore(channel): update $channel to $RELEASE_TAG"
            git -C "$channel_worktree" push origin release-channel
          fi
      - name: Publish the final GitHub Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          DEPLOYMENT_SNAPSHOT_COMMIT: ${{ steps.deployment.outputs.merge_sha }}
        run: |
          set -euo pipefail
          NOTES_FILE="release-notes/${RELEASE_TAG}.md"
          test -f "$NOTES_FILE"
          prerelease=false
          [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)\.[0-9]+$ ]] && prerelease=true
          tag_ref_response="$(mktemp)"
          tag_sha=""
          if gh api "/repos/${PUBLIC_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >"$tag_ref_response" 2>/dev/null; then
            tag_sha="$(jq -er '.object.sha' "$tag_ref_response")"
          else
            # `gh api` writes GitHub's JSON error body to stdout. Only a real
            # 404 means the immutable tag can be created; all other failures
            # must stop publication instead of being treated as absence.
            tag_ref_status="$(jq -r '.status // empty' "$tag_ref_response" 2>/dev/null || true)"
            [ "$tag_ref_status" = "404" ] || {
              echo "failed to resolve immutable public tag (status: ${tag_ref_status:-unknown})" >&2
              rm -f "$tag_ref_response"
              exit 1
            }
          fi
          rm -f "$tag_ref_response"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$DEPLOYMENT_SNAPSHOT_COMMIT" ]; then
            echo "immutable public tag points to a different commit: $tag_sha" >&2
            exit 1
          fi
          if [ -z "$tag_sha" ]; then
            gh api --method POST "/repos/${PUBLIC_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="$DEPLOYMENT_SNAPSHOT_COMMIT" >/dev/null
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPOSITORY" >/dev/null 2>&1; then
            release_args=("$RELEASE_TAG" --repo "$PUBLIC_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file "$NOTES_FILE")
            [ "$prerelease" = true ] && release_args+=(--prerelease)
            gh release create "${release_args[@]}"
          else
            gh release edit "$RELEASE_TAG" --repo "$PUBLIC_REPOSITORY" --draft=false --prerelease="$prerelease" --notes-file "$NOTES_FILE"
          fi
          publish_asset() {
            local file="$1" name expected actual url tmp asset_json asset_list asset_count
            name="$(basename "$file")"
            expected="$(sha256sum "$file" | awk '{print $1}')"
            asset_list="$(gh api "/repos/${PUBLIC_REPOSITORY}/releases/tags/${RELEASE_TAG}" | jq -c --arg name "$name" '[.assets[]? | select(.name == $name)]')"
            asset_count="$(jq -er 'length' <<<"$asset_list")"
            [ "$asset_count" -le 1 ] || { echo "final Release contains duplicate assets: $name" >&2; exit 1; }
            if [ "$asset_count" -eq 1 ]; then
              asset_json="$(jq -ce '.[0]' <<<"$asset_list")"
              actual="$(jq -r '.digest // empty' <<<"$asset_json")"
              if [ "$actual" != "sha256:$expected" ]; then
                url="$(jq -er '.url' <<<"$asset_json")"
                tmp="$(mktemp)"
                curl --fail --location --silent --show-error -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${GH_TOKEN}" "$url" -o "$tmp"
                actual="sha256:$(sha256sum "$tmp" | awk '{print $1}')"
                rm -f "$tmp"
              fi
              [ "$actual" = "sha256:$expected" ] || { echo "final Release asset digest conflict: $name" >&2; exit 1; }
              return
            fi
            gh release upload "$RELEASE_TAG" --repo "$PUBLIC_REPOSITORY" "$file"
            asset_list="$(gh api "/repos/${PUBLIC_REPOSITORY}/releases/tags/${RELEASE_TAG}" | jq -c --arg name "$name" '[.assets[]? | select(.name == $name)]')"
            asset_count="$(jq -er 'length' <<<"$asset_list")"
            [ "$asset_count" -eq 1 ] || { echo "final Release upload did not produce exactly one asset: $name" >&2; exit 1; }
            asset_json="$(jq -ce '.[0]' <<<"$asset_list")"
            actual="$(jq -r '.digest // empty' <<<"$asset_json")"
            if [ "$actual" != "sha256:$expected" ]; then
              url="$(jq -er '.url' <<<"$asset_json")"
              tmp="$(mktemp)"
              curl --fail --location --silent --show-error -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${GH_TOKEN}" "$url" -o "$tmp"
              actual="sha256:$(sha256sum "$tmp" | awk '{print $1}')"
              rm -f "$tmp"
            fi
            [ "$actual" = "sha256:$expected" ] || { echo "final Release upload digest conflict: $name" >&2; exit 1; }
          }
          publish_asset dist/final/release.manifest.yaml
          publish_asset dist/final/runtime-composition.json
          publish_asset dist/final/component-evidence.json
          publish_asset dist/final/public-release-provenance.json
          publish_asset "dist/final/deployment/lunafox-${RELEASE_TAG}.zip"
          publish_asset dist/final/deployment-packages.json
      - name: Upload the complete final publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-final-release-${{ steps.deployment.outputs.merge_sha }}
          path: |
            dist/final/release.manifest.yaml
            dist/final/runtime-composition.json
            dist/final/runtime-composition.core.json
            dist/final/runtime-composition-finalization.json
            dist/final/runtime-composition-binding.json
            dist/final/runtime-composition-verification.json
            dist/final/component-evidence.json
            dist/final/component-evidence-build.json
            dist/final/component-evidence-verification.json
            dist/final/composition-plan/**
            dist/final/public-release-provenance.json
            dist/final/release-verification.json
            dist/final/release-notes-validation.json
            dist/final/documentation-validation.json
            dist/final/deployment/*.zip
            dist/final/deployment-publication.json
            dist/final/deployment-snapshot/**
            dist/final/deployment-packages.json
            dist/final/runtime-verification/**
            dist/final/runtime-evidence/**
            dist/final/engine-verification.json
            dist/final/signatures/**
            dist/final/channel/**
          if-no-files-found: error
