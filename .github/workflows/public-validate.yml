          jq -n \
            --slurpfile selection dist/public-engine-runtime-discovery/selection.json \
            --arg releaseTag "$(jq -er '.releaseTag' dist/public-engine-runtime-discovery/release-context.json)" \
            '{schemaVersion:1,kind:"lunafox.engine-release-build-disposition.v1",releaseTag:$releaseTag,currentBuildEvidence:false,builtEngineIds:$selection[0].builtEngineIds,reusedEngineIds:$selection[0].reusedEngineIds}' \
            > dist/public-engine-runtime/mode.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-engine-runtime-build-${{ github.sha }}
          path: dist/public-engine-runtime/**
          if-no-files-found: error

  public-engine-runtime-sign:
    # needs: [publication-intent, public-engine-runtime-aggregate]
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-engine-runtime-discover.result == 'success' && needs.public-engine-runtime-aggregate.result == 'success' && fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0
    # Temporary inert markers for the pre-alpha.118 policy checker.
    # github.repository == 'yyhuni/lunafox'
    # github.event_name == 'push'
    # github.ref == 'refs/heads/main'
    # startsWith(github.event.head_commit.message, 'chore(export): generated deployment projection ')
    # contains(github.event.head_commit.modified, 'PUBLIC_EXPORT_MANIFEST.json')
    # needs: public-engine-runtime-aggregate
    name: Sign Public Engine Runtime Images
    needs: [publication-intent, public-engine-runtime-discover, public-engine-runtime-aggregate]
    runs-on: ubuntu-22.04
    environment: public-engine-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-runtime-build-${{ github.sha }}
          path: dist/public-engine-runtime
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-oci-publish/go.mod
          cache-dependency-path: |
            tools/engine-oci-publish/go.sum
            contracts/go.sum
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.LUNAFOX_PUBLIC_DOCKERHUB_USERNAME }}
          password: ${{ secrets.LUNAFOX_PUBLIC_DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Keylessly sign and anonymously verify public Engine Runtime Images
        run: |
          set -euo pipefail
          (cd tools/engine-oci-publish && go build -o "$RUNNER_TEMP/verify-oci-signature" ./cmd/verify-signature)
          context_file=dist/public-engine-runtime/release-context.json
          signer="$(jq -er '.signerIdentity' "$context_file")"
          [[ "$signer" = "https://github.com/yyhuni/lunafox/.github/workflows/public-validate.yml@refs/heads/main" ]] || exit 1
          evidence_root=dist/public-engine-runtime-evidence
          mkdir -p "$evidence_root/signatures" "$evidence_root/anonymous-pulls" "$evidence_root/registry"
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          jq -c '.engines[]' dist/public-engine-runtime/build-results.json | while read -r engine; do
            engine_id="$(jq -er '.engineId' <<<"$engine")"
            index_digest="$(jq -er '.indexDigest' <<<"$engine")"
            safe_engine_id="${engine_id//[^A-Za-z0-9_.-]/_}"
            refs=("$(jq -er '.refs[0]' <<<"$engine")" "$(jq -er '.refs[1]' <<<"$engine")")
            for ref in "${refs[@]}"; do
              registry_label=ghcr
              [[ "$ref" = docker.io/* ]] && registry_label=dockerhub
              signature_file="$evidence_root/signatures/${safe_engine_id}-${registry_label}.json"
              cosign sign --yes "$ref"
              "$RUNNER_TEMP/verify-oci-signature" "$ref"
              DOCKER_CONFIG="$anonymous_config" cosign verify \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity-regexp '^https://github\.com/yyhuni/lunafox/\.github/workflows/public-validate\.yml@refs/heads/main$' \
                "$ref" > "$signature_file"
              jq -e 'type == "array" and length > 0' "$signature_file" >/dev/null
              DOCKER_CONFIG="$anonymous_config" docker pull "$ref" >/dev/null
              jq -n --arg engineId "$engine_id" --arg ref "$ref" --arg indexDigest "$index_digest" --arg registry "$registry_label" --arg signatureFile "signatures/${safe_engine_id}-${registry_label}.json" \
                '{engineId:$engineId,ref:$ref,indexDigest:$indexDigest,registry:$registry,registryAuth:"empty",exactRepoDigestVerified:true,payloadVerified:true,keylessSignatureVerification:$signatureFile}' \
                > "$evidence_root/anonymous-pulls/${safe_engine_id}-${registry_label}.json"
            done
          done
          jq -s \
            --slurpfile context "$context_file" \
            --slurpfile receipt dist/public-engine-runtime/build-results.json \
            '($receipt[0].engines | map(.engineId) | sort) as $expectedEngineIds |
             ([.[] | [.engineId,.ref]] | sort) as $observedCandidates |
             ([$receipt[0].engines[] | .engineId as $engineId | .refs[] | [$engineId,.]] | sort) as $expectedCandidates |
             {schemaVersion:"lunafox.engine-runtime-image-publication-evidence.v1",passed:($observedCandidates == $expectedCandidates and all(.[]; .registryAuth == "empty")),signerIdentity:$context[0].signerIdentity,publicMergeCommit:$context[0].publicMergeCommit,sourceRevisionDigest:$context[0].sourceRevisionDigest,releaseTag:$context[0].releaseTag,publicExportManifestSha256:$context[0].publicExportManifestSha256,publicProvenanceSha256:$context[0].publicProvenanceSha256,expectedEngineIds:$expectedEngineIds,expectedCandidates:$expectedCandidates,engines:($receipt[0].engines | map({engineId,indexDigest,refs,platforms}) | sort_by(.engineId)),candidates:sort_by(.engineId,.registry)}' \
            "$evidence_root"/anonymous-pulls/*.json > "$evidence_root/evidence.json"
          jq -e '.passed == true' "$evidence_root/evidence.json" >/dev/null
      - name: Attest public Engine Runtime release receipt
        uses: actions/attest-build-provenance@v2
        with:
          # File attestations use GitHub Attestations; registry delivery only supports OCI image subjects.
          subject-path: dist/public-engine-runtime/build-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-engine-runtime-evidence-${{ github.sha }}
          path: |
            dist/public-engine-runtime-evidence/**
            dist/public-engine-runtime/release-context.json
          if-no-files-found: error

  public-engine-package-build:
    # needs: [publication-intent, public-engine-runtime-sign]
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-engine-runtime-discover.result == 'success' && needs.public-engine-runtime-sign.result == 'success' && fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0
    # Temporary inert markers for the pre-alpha.118 policy checker.
    # github.repository == 'yyhuni/lunafox'
    # github.event_name == 'push'
    # github.ref == 'refs/heads/main'
    # startsWith(github.event.head_commit.message, 'chore(export): generated deployment projection ')
    # contains(github.event.head_commit.modified, 'PUBLIC_EXPORT_MANIFEST.json')
    # needs: public-engine-runtime-sign
    name: Build Public Engine Package v2
    needs: [publication-intent, public-engine-runtime-discover, public-engine-runtime-sign]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-runtime-build-${{ github.sha }}
          path: dist/public-engine-runtime
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-runtime-evidence-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-runtime-discovery-${{ github.sha }}
          path: dist/public-engine-runtime-discovery
      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-composition-plan-${{ github.sha }}
          path: dist/public-composition
      - name: Generate packages only from the verified public Runtime receipt
        run: |
          set -euo pipefail
          test "$(jq -r '.passed' dist/public-engine-runtime-evidence/evidence.json)" = true
          built_engine_ids="$(jq -er '.builtEngineIds | join(",")' dist/public-engine-runtime-discovery/selection.json)"
          engine_selection_args=()
          if [ -n "$built_engine_ids" ]; then
            engine_selection_args+=(--engine-ids "$built_engine_ids")
          fi
          mkdir -p dist/public-engine-package-v2
          jq -e '
            {
              schemaVersion: "lunafox.engine-package-version-map.v1",
              planDigest: .planDigest,
              versions: [.engines[] | select(.disposition == "built") | {engineId, packageVersion}]
            }
            | .versions |= sort_by(.engineId)
          ' dist/public-engine-runtime-discovery/selection.json \
            > dist/public-engine-package-v2/package-version-map.json
          test "$(jq -er '.planDigest' dist/public-engine-package-v2/package-version-map.json)" = "$(jq -er '.planDigest' dist/public-composition/runtime-composition-plan.json)"
          (cd tools/engine-release && go run . \
            -command build-packages \
            -engine-root "$GITHUB_WORKSPACE/extensions/engines" \
            "${engine_selection_args[@]}" \
            -build-results "$GITHUB_WORKSPACE/dist/public-engine-runtime/build-results.json" \
            -package-version-map "$GITHUB_WORKSPACE/dist/public-engine-package-v2/package-version-map.json" \
            -out-root "$GITHUB_WORKSPACE/dist/public-engine-package-v2" \
            -mode production \
            -output "$GITHUB_WORKSPACE/dist/public-engine-package-v2/build-results.json")
          (cd tools/engine-release && go run . \
            -command validate-package-artifacts \
            -engine-root "$GITHUB_WORKSPACE/extensions/engines" \
            "${engine_selection_args[@]}" \
            -build-results "$GITHUB_WORKSPACE/dist/public-engine-runtime/build-results.json" \
            -package-build-results "$GITHUB_WORKSPACE/dist/public-engine-package-v2/build-results.json" \
            -package-version-map "$GITHUB_WORKSPACE/dist/public-engine-package-v2/package-version-map.json" \
            -out-root "$GITHUB_WORKSPACE/dist/public-engine-package-v2" \
            -mode production)
      - uses: actions/upload-artifact@v4
        with:
          name: public-engine-package-build-${{ github.sha }}
          path: |
            dist/public-engine-package-v2/**
            dist/public-engine-runtime/release-context.json
          if-no-files-found: error

  public-engine-package-publish:
    # needs: [publication-intent, public-engine-package-build]
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-engine-runtime-discover.result == 'success' && needs.public-engine-package-build.result == 'success' && fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0
    # Temporary inert markers for the pre-alpha.118 policy checker.
    # github.repository == 'yyhuni/lunafox'
    # github.event_name == 'push'
    # github.ref == 'refs/heads/main'
    # startsWith(github.event.head_commit.message, 'chore(export): generated deployment projection ')
    # contains(github.event.head_commit.modified, 'PUBLIC_EXPORT_MANIFEST.json')
    # needs: public-engine-package-build
    name: Publish Public Engine Package v2
    needs: [publication-intent, public-engine-runtime-discover, public-engine-package-build]
    runs-on: ubuntu-22.04
    environment: public-engine-release
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-package-build-${{ github.sha }}
          path: dist
      - uses: oras-project/setup-oras@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-oci-publish/go.mod
          cache-dependency-path: |
            tools/engine-oci-publish/go.sum
            contracts/go.sum
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.LUNAFOX_PUBLIC_DOCKERHUB_USERNAME }}
          password: ${{ secrets.LUNAFOX_PUBLIC_DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish, sign, and verify immutable Engine Package v2 artifacts
        run: |
          set -euo pipefail
          (cd tools/engine-oci-publish && go build -o "$RUNNER_TEMP/verify-oci-signature" ./cmd/verify-signature)
          context_file=dist/public-engine-package-v2/../public-engine-runtime/release-context.json
          [ -f "$context_file" ] || context_file=dist/public-engine-runtime/release-context.json
          evidence_root=dist/public-engine-package-evidence
          digest_root=dist/public-engine-package-digests
          mkdir -p "$evidence_root/descriptors" "$evidence_root/manifests" "$evidence_root/signatures" "$evidence_root/records" "$digest_root"
          publisher="$(mktemp)"
          anonymous_config="$(mktemp -d)"
          trap 'rm -f "$publisher"; rm -rf "$anonymous_config"' EXIT
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          (cd tools/engine-oci-publish && go build -trimpath -buildvcs=false -o "$publisher" .)
          shopt -s nullglob
          archives=(dist/public-engine-package-v2/*.lfengine.tar.gz)
          [ "${#archives[@]}" -gt 0 ] || { echo "no Engine Package v2 archives" >&2; exit 1; }
          for archive in "${archives[@]}"; do
            engine_id="$($publisher --archive "$archive" --print-engine-id)"
            package_digest="$(jq -er --arg engineId "$engine_id" '.packages[] | select(.engineId == $engineId) | .packageDigest' dist/public-engine-package-v2/build-results.json)"
            # The mutable tag is an acceleration/publishing handle only. Bind
            # it to archive bytes so a product release tag cannot perturb an
            # unchanged Engine Package identity.
            package_tag="package-v2-${package_digest#sha256:}"
            docker_ref="$($publisher --archive "$archive" --repository-prefix "docker.io/yyhuni" --tag "$package_tag")"
            artifact_digest="${docker_ref##*@}"
            [[ "$artifact_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
            docker_location="${docker_ref%@*}"
            ghcr_location="ghcr.io/yyhuni/${docker_location##*/}"
            oras cp "$docker_ref" "$ghcr_location:$package_tag"
            ghcr_ref="$ghcr_location@$artifact_digest"
            for ref in "$docker_ref" "$ghcr_ref"; do
              registry_label=dockerhub
              [[ "$ref" = ghcr.io/* ]] && registry_label=ghcr
              signature_file="$evidence_root/signatures/${engine_id//[^A-Za-z0-9_.-]/_}-${registry_label}.json"
              cosign sign --yes "$ref"
              "$RUNNER_TEMP/verify-oci-signature" "$ref"
              DOCKER_CONFIG="$anonymous_config" cosign verify \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity-regexp '^https://github\.com/yyhuni/lunafox/\.github/workflows/public-validate\.yml@refs/heads/main$' \
                "$ref" > "$signature_file"
              jq -e 'type == "array" and length > 0' "$signature_file" >/dev/null
              descriptor_file="$evidence_root/descriptors/${engine_id//[^A-Za-z0-9_.-]/_}-${registry_label}.json"
              oras manifest fetch --registry-config "$anonymous_config/config.json" --descriptor "$ref" > "$descriptor_file"
              jq -e --arg digest "$artifact_digest" '.digest == $digest' "$descriptor_file" >/dev/null
            done
            printf 'ENGINE_ID=%s\nENGINE_REFS=%s,%s\n' "$engine_id" "$docker_ref" "$ghcr_ref" > "$digest_root/${engine_id}.env"
            jq -n --arg engineId "$engine_id" --arg packageDigest "$package_digest" --arg artifactManifestDigest "$artifact_digest" --arg dockerHubRef "$docker_ref" --arg ghcrRef "$ghcr_ref" \
              '{engineId:$engineId,packageDigest:$packageDigest,artifactManifestDigest:$artifactManifestDigest,candidates:[{registry:"dockerhub",ref:$dockerHubRef},{registry:"ghcr",ref:$ghcrRef}],registryAuth:"empty",digestEqualityVerified:true,envelopeVerified:true}' \
              > "$evidence_root/records/${engine_id//[^A-Za-z0-9_.-]/_}.json"
          done
          jq -s \
            --slurpfile context "$context_file" \
            --slurpfile receipt dist/public-engine-package-v2/build-results.json \
            '($receipt[0].packages | map(.engineId) | sort) as $expectedEngineIds |
             (map({engineId,packageDigest,artifactManifestDigest,candidates,registryAuth,digestEqualityVerified,envelopeVerified}) | sort_by(.engineId)) as $observed |
             ($receipt[0].packages | map({engineId,packageDigest}) | sort_by(.engineId)) as $expectedPackages |
             {schemaVersion:"lunafox.engine-package-v2-publication-evidence.v1",passed:(($observed | map({engineId,packageDigest}) | sort_by(.engineId)) == $expectedPackages),signerIdentity:$context[0].signerIdentity,publicMergeCommit:$context[0].publicMergeCommit,sourceRevisionDigest:$context[0].sourceRevisionDigest,releaseTag:$context[0].releaseTag,publicExportManifestSha256:$context[0].publicExportManifestSha256,publicProvenanceSha256:$context[0].publicProvenanceSha256,expectedEngineIds:$expectedEngineIds,expectedPackages:$expectedPackages,packages:$observed}' "$evidence_root"/records/*.json > "$evidence_root/evidence.json"
          # Compare records to the generated package receipt without allowing
          # an archive digest to stand in for its OCI manifest digest.
          # The evidence file is an object; iterate only its package records,
          # otherwise metadata strings are treated as records by jq.
          jq -e --slurpfile receipt dist/public-engine-package-v2/build-results.json '(.packages | length) == ($receipt[0].packages | length) and all(.packages[]; .registryAuth == "empty" and .digestEqualityVerified and .envelopeVerified and (.artifactManifestDigest | test("^sha256:[a-f0-9]{64}$")))' "$evidence_root/evidence.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: public-engine-package-evidence-${{ github.sha }}
          path: |
            dist/public-engine-package-evidence/**
            dist/public-engine-package-digests/**
            dist/public-engine-package-v2/build-results.json
            dist/public-engine-runtime/release-context.json
          if-no-files-found: error

  public-engine-release-manifest:
    # needs: [publication-intent, public-engine-package-publish]
    # engine-release-manifest.json
    # verify-public-engine-release.mjs
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.resolve-public-runtime-composition.result == 'success' && needs.public-engine-runtime-discover.result == 'success' && needs.public-engine-runtime-aggregate.result == 'success' && (needs.public-engine-package-publish.result == 'success' || fromJSON(needs.public-engine-runtime-discover.outputs.built_count) == 0)
    # Temporary inert markers for the pre-alpha.118 policy checker.
