name: Public Projection Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Every PR/export job is secretless and runs on GitHub-hosted infrastructure.
# Publication is a separate protected-main job with its own least-privilege
# permissions; no untrusted event can reach that job.
permissions:
  contents: read

concurrency:
  # Cancel superseded PR checks, but never interrupt a protected-main release.
  group: public-projection-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

env:
  PUBLIC_REPOSITORY: yyhuni/lunafox
  PRIVATE_REPOSITORY: yyhuni/lunafox-private

jobs:
  validation-scope:
    if: github.repository == 'yyhuni/lunafox'
    name: Select Public Validation Scope
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - id: scope
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Workflow maintenance lands before its source projection. Until the
          # selector arrives, run every check rather than infer a narrow scope.
          if [ -f scripts/ci/select-public-validation-scope.mjs ]; then
            node scripts/ci/select-public-validation-scope.mjs
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi

  validate-export:
    if: github.repository == 'yyhuni/lunafox'
    name: Public Source Validation
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pull requests are validated against the reviewed projection commit,
          # not GitHub's synthetic merge commit. The latter is not part of the
          # controlled public history and would fail the fresh-history guard.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install public deployment guard dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify exact exported file manifest and immutable Agent bundle
        run: node scripts/ci/check-public-export.mjs --require-agent-bundle --json

      - name: Verify bilingual public documentation
        # The destination-owned workflow is merged before the next source
        # projection; skip this source-owned check until that projection lands.
        if: ${{ hashFiles('scripts/ci/validate-public-documentation.mjs') != '' }}
        run: |
          set -euo pipefail
          # Runtime source closure rejects generated output inside the checkout.
          # Keep this validation evidence in the runner workspace instead.
          node scripts/ci/validate-public-documentation.mjs \
            --root-dir "$GITHUB_WORKSPACE" --json \
            | tee "$RUNNER_TEMP/public-documentation-validation.json"

      - name: Verify Agent bundle schema from the generated Git tree
        shell: bash
        run: |
          set -euo pipefail
          agent_directory="$(find agent/bin -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -u)"
          [ "$(find agent/bin -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -u | wc -l)" -eq 1 ]
          if [[ "$agent_directory" =~ ^sha256-[a-f0-9]{64}$ ]]; then
            input_fingerprint="sha256:${agent_directory#sha256-}"
            node scripts/ci/verify-agent-binary-bundle.mjs \
              --bundle-dir "agent/bin/$agent_directory" --artifact-id "$agent_directory" \
              --input-fingerprint "$input_fingerprint" --json
          else
            # Workflow maintenance is validated before its next source projection,
            # so the checked-out public tree can still carry the prior tag directory.
            release_tag="$(jq -er '.releaseTag' PUBLIC_PROVENANCE.json)"
            [ "$agent_directory" = "$release_tag" ] || {
              echo "Agent bundle directory does not match the immutable or current release identity" >&2
              exit 1
            }
            source_revision_digest="$(jq -er '.sourceRevisionDigest' PUBLIC_PROVENANCE.json)"
            public_provenance_sha256="sha256:$(sha256sum PUBLIC_PROVENANCE.json | awk '{print $1}')"
            node scripts/ci/verify-agent-binary-bundle.mjs \
              --bundle-dir "agent/bin/$release_tag" --public-export-root "$GITHUB_WORKSPACE" \
              --tag "$release_tag" --source-revision-digest "$source_revision_digest" \
              --public-provenance-sha256 "$public_provenance_sha256" --json
          fi

      - name: Verify public Runtime source closure
        run: bash scripts/ci/verify-public-runtime-source.sh --json

      - name: Verify public Runtime Docker descriptors
        run: node scripts/ci/verify-public-runtime-contexts.mjs --json

      - name: Verify Agent wrapper without private binaries
        run: node scripts/ci/verify-public-agent-wrapper.mjs --json

      - name: Verify production deployment closure
        run: bash scripts/ci/verify-public-deployment.sh --evidence dist/public-deployment-evidence.json

      - name: Audit GPL scope and deferred Agent security claims
        run: node scripts/ci/audit-public-security-scope.mjs --root-dir . --json

      - name: Test release scheduling and deployment publication
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ci/publish-public-deployment.test.mjs scripts/ci/finalize-engine-runtime-platforms.test.mjs
          if [ -f scripts/ci/component-evidence-bundle-selftest.mjs ]; then
            node scripts/ci/component-evidence-bundle-selftest.mjs
          fi
          if [ -f scripts/ci/select-public-validation-scope.test.mjs ]; then
            node --test scripts/ci/select-public-validation-scope.test.mjs
          fi

      - name: Verify public release policy boundary
        run: node scripts/ci/check-public-release-policy.mjs --root-dir . --public-only --json

      - name: Verify migration and Engine API release policies
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(jq -er '.releaseTag' PUBLIC_PROVENANCE.json)"
          case "$release_tag" in
            v[0-9]*.[0-9]*.[0-9]*-alpha.*|v[0-9]*.[0-9]*.[0-9]*-beta.*|v[0-9]*.[0-9]*.[0-9]*-rc.*) release_channel=canary ;;
            v[0-9]*.[0-9]*.[0-9]*) release_channel=stable ;;
            *) echo "unsupported generated release tag: $release_tag" >&2; exit 1 ;;
          esac
          node scripts/ci/check-migration-baseline-policy.mjs \
            --release-channel "$release_channel" --deployment-mode disposable
          node scripts/ci/check-engine-api-major-policy.mjs \
            --release-channel "$release_channel"

      - name: Verify channel schema and release manifest identity
        run: |
          set -euo pipefail
          channel_dir=channels
          manifest_dir=manifests
          if [ -e "$channel_dir" ] || [ -e "$manifest_dir" ]; then
            [ -d "$channel_dir" ] && [ -d "$manifest_dir" ] || {
              echo "channels and manifests must be both present directories or both absent" >&2
              exit 1
            }
            if [ -f "$channel_dir/v0.0.1-alpha.57.env" ]; then
              test -f "$channel_dir/canary.env"
              test -f "$manifest_dir/v0.0.1-alpha.57.yaml"
              node scripts/ci/check-public-channel.mjs --root-dir . --require-first-release
            else
              node scripts/ci/check-public-channel.mjs --root-dir .
            fi
            if rg -n 'alpha\.46|SCHEMA_VERSION=2|IMAGE_REGISTRY=|IMAGE_NAMESPACE=|WORKER_IMAGE|lunafox-installer|checksums\.txt' "$channel_dir" "$manifest_dir"; then
              echo "retired channel content found" >&2
              exit 1
            fi
            for manifest in "$manifest_dir"/v*.yaml; do
              [ -f "$manifest" ] || continue
              tag="$(basename "$manifest" .yaml)"
              node scripts/ci/verify-public-release.mjs --manifest "$manifest" --tag "$tag" --json
            done
          fi

      # The destination-owned workflow lands before the new source policy.
      # Keep the full inline lane until the selector and matrix policy arrive.
      - name: Install frontend dependencies
        if: ${{ hashFiles('scripts/ci/select-public-validation-scope.mjs') == '' }}
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser binaries
        if: ${{ hashFiles('scripts/ci/select-public-validation-scope.mjs') == '' }}
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Chromium for browser-backed contract tests
        if: ${{ hashFiles('scripts/ci/select-public-validation-scope.mjs') == '' }}
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install-deps chromium
          fi

      - name: Validate public frontend source
        if: ${{ hashFiles('scripts/ci/select-public-validation-scope.mjs') == '' }}
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run check:ui-foundation
          pnpm run check:service-mock-mode
          pnpm run check:foundation-ledger


      - name: Upload public validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-validation-${{ github.run_id }}
          path: dist/public-deployment-evidence.json
          if-no-files-found: warn

  validate-frontend:
    name: Public Frontend Validation (${{ matrix.lane }})
    needs: validation-scope
    if: github.repository == 'yyhuni/lunafox' && needs.validation-scope.outputs.scope == 'full'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        lane: [types, lint, test-1, test-2, test-3, test-4, test-5, test-6, test-7, test-8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browser binaries
        if: startsWith(matrix.lane, 'test-')
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Chromium for browser-backed contract tests
        if: startsWith(matrix.lane, 'test-')
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install-deps chromium
          fi
      - name: Validate public frontend source
        working-directory: frontend
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            types) pnpm run typecheck ;;
            lint)
              pnpm run lint
              pnpm run check:ui-foundation
              pnpm run check:service-mock-mode
              pnpm run check:foundation-ledger
              ;;
            test-*) pnpm run test --shard="${LANE#test-}/8" ;;
            *) echo "unknown frontend lane: $LANE" >&2; exit 1 ;;
          esac

  validate-public-go:
    needs: validation-scope
    if: github.repository == 'yyhuni/lunafox' && needs.validation-scope.outputs.scope == 'full'
    name: Public Go And Extension Validation
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            directory: server
          - name: contracts
            directory: contracts
          - name: engine-go
            directory: engine-go
          - name: extensions
            directory: extensions/engines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: ${{ matrix.directory }}/go.sum
      - name: Install server guard dependencies
        if: matrix.name == 'server'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Run public Go tests
        working-directory: ${{ matrix.directory }}
        run: go test ./... -count=1
      - name: Run server boundary checks
        if: matrix.name == 'server'
        working-directory: server
        run: make check-ddd
      - name: Run public extension contract checks
        if: matrix.name == 'extensions'
        working-directory: extensions/engines
        run: go test ./container -count=1

  validate-public-proto:
    needs: validation-scope
    if: github.repository == 'yyhuni/lunafox' && needs.validation-scope.outputs.scope == 'full'
    name: Public Proto Validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
      - name: Install pinned protoc
        env:
          PROTOC_VERSION: '33.4'
          PROTOC_SHA256: c0040ea9aef08fdeb2c74ca609b18d5fdbfc44ea0042fcfbfb38860d35f7dd66
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}.zip"
          root="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          printf '%s  %s\n' "$PROTOC_SHA256" "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/protoc" --version | grep -Fx 'libprotoc 33.4'
      - name: Install pinned Go generators
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Verify generated Proto bindings
        run: bash proto/scripts/check-generated.sh
      - name: Run generated binding tests
        working-directory: contracts
        run: go test ./gen/... -count=1

  validate-runtime-contexts:
    needs: validation-scope
    if: github.repository == 'yyhuni/lunafox' && needs.validation-scope.outputs.scope == 'full'
    name: Public Runtime Context Build (${{ matrix.component }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: .
            dockerfile: server/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: nginx
            context: docker/nginx
            dockerfile: docker/nginx/Dockerfile
          - component: bootstrap
            context: .
            dockerfile: docker/bootstrap/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build public Runtime context without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=lunafox-public-context-${{ matrix.component }}
            type=gha,scope=lunafox-public-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=lunafox-public-context-${{ matrix.component }}

  public-validation:
    if: always() && github.repository == 'yyhuni/lunafox'
    name: Public Projection Validation
    runs-on: ubuntu-22.04
    needs: [validation-scope, validate-export, validate-frontend, validate-public-go, validate-public-proto, validate-runtime-contexts]
    steps:
      - name: Require every public check to pass
        run: |
          set -euo pipefail
          [ "${{ needs.validation-scope.result }}" = success ]
          [ "${{ needs.validate-export.result }}" = success ]
          scope="${{ needs.validation-scope.outputs.scope }}"
          case "$scope" in full|deployment|validated-source) ;; *) exit 1 ;; esac
          for result in \
            "${{ needs.validate-frontend.result }}" \
            "${{ needs.validate-public-go.result }}" \
            "${{ needs.validate-public-proto.result }}" \
            "${{ needs.validate-runtime-contexts.result }}"; do
            if [ "$result" != success ]; then
              if { [ "$scope" = deployment ] || [ "$scope" = validated-source ]; } && [ "$result" = skipped ]; then continue; fi
              echo "public validation dependency did not pass: $result" >&2
              exit 1
            fi
          done
          echo "Public Projection Validation passed"

  # The push payload does not reliably populate its changed-file list. Resolve
  # publication intent from the checked-out protected-main history instead.
  publication-intent:
    if: github.repository == 'yyhuni/lunafox'
    name: Resolve Public Release Intent
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: intent
        name: Verify the source projection merge
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_EVENT_NAME" = push ] || exit 0
          [ "$GITHUB_REF" = refs/heads/main ] || exit 0
          git rev-parse --verify HEAD^ >/dev/null
          test -f PUBLIC_PROVENANCE.json
          release_tag="$(jq -er '.releaseTag' PUBLIC_PROVENANCE.json)"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          head_subject="$(git log -1 --format=%s)"
          merge_subject_pattern="^Merge[[:space:]]pull[[:space:]]request[[:space:]]#[0-9]+[[:space:]]from[[:space:]]yyhuni/export/${release_tag//./\\.}(-retry-[0-9]+)?$"
          squash_subject_pattern="^chore\\(export\\):[[:space:]]generated[[:space:]]deployment[[:space:]]projection[[:space:]]${release_tag//./\\.}[[:space:]]\\(#[0-9]+\\)$"
          [[ "$head_subject" =~ $merge_subject_pattern || "$head_subject" =~ $squash_subject_pattern ]] || exit 0
          git diff-tree --no-commit-id --name-only -r HEAD^ HEAD -- PUBLIC_EXPORT_MANIFEST.json |
            grep -Fxq PUBLIC_EXPORT_MANIFEST.json || exit 0
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Verified protected source projection: publish=true"

  # Resolve the complete deployable input identity before any Registry
  # publication. Reuse is granted only from a prior release's canonical
  # composition and immutable evidence. No prior asset means a full built
  # plan; a discovered asset that fails verification fails the release closed
  # rather than silently weakening the evidence boundary.
  resolve-public-runtime-composition:
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-validation.result == 'success'
    name: Resolve Public Runtime Composition
    needs: [publication-intent, public-validation]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      previous_release: ${{ steps.previous.outputs.previous_release }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-release/go.mod
          cache-dependency-path: tools/engine-release/go.sum
      - uses: docker/setup-buildx-action@v3
      - id: source
        name: Bind composition to the protected public merge
        run: |
          set -euo pipefail
          release_tag="$(jq -er '.releaseTag' PUBLIC_PROVENANCE.json)"
          source_revision_digest="$(jq -er '.sourceRevisionDigest' PUBLIC_PROVENANCE.json)"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$source_revision_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_revision_digest=$source_revision_digest" >> "$GITHUB_OUTPUT"
          echo "public_merge_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - id: previous
        name: Retrieve the previous verified composition asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/public-composition
          previous_release_record="$(
            gh api --paginate --slurp "/repos/${PUBLIC_REPOSITORY}/releases?per_page=100" |
              jq -c --arg current "$RELEASE_TAG" '
                (add // [])
                | map(select(.draft == false and .tag_name != $current))
                | map(select(
                    any(.assets[]?; .name == "runtime-composition.json") and
                    any(.assets[]?; .name == "release.manifest.yaml") and
                    any(.assets[]?; .name == "component-evidence.json") and
                    any(.assets[]?; .name == "public-release-provenance.json")
                  ))
                | sort_by(.published_at // .created_at)
                | reverse
                | .[0] // null
              '
          )"
          if [ "$previous_release_record" != null ]; then
            previous_release_tag="$(jq -er '.tag_name' <<<"$previous_release_record")"
            download_verified_asset() {
              local asset_name="$1" output_file="$2" asset_json expected actual url
              asset_json="$(jq -ce --arg name "$asset_name" '
                [.assets[]? | select(.name == $name)] |
                if length == 1 then .[0] else error("release asset must exist exactly once") end
              ' <<<"$previous_release_record")"
              url="$(jq -er '.url' <<<"$asset_json")"
              expected="$(jq -er '.digest' <<<"$asset_json")"
              [[ "$expected" =~ ^sha256:[a-f0-9]{64}$ ]] || {
                echo "previous release asset has no immutable GitHub digest: $asset_name" >&2
                exit 1
              }
              curl --fail --silent --show-error --location \
                -H "Accept: application/octet-stream" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "$url" -o "$output_file"
              actual="sha256:$(sha256sum "$output_file" | awk '{print $1}')"
              [ "$actual" = "$expected" ] || {
                echo "previous release asset bytes do not match the GitHub Release digest: $asset_name" >&2
                exit 1
              }
            }
            download_verified_asset runtime-composition.json dist/public-composition/previous.json
            download_verified_asset release.manifest.yaml dist/public-composition/previous.manifest.yaml
            download_verified_asset component-evidence.json dist/public-composition/previous.component-evidence.json
            download_verified_asset public-release-provenance.json dist/public-composition/previous.public-release-provenance.json
            node scripts/ci/verify-public-release.mjs \
              --manifest dist/public-composition/previous.manifest.yaml \
              --tag "$previous_release_tag" --json \
              > dist/public-composition/previous-release-verification.json
            node scripts/ci/verify-public-release-evidence.mjs \
              --manifest dist/public-composition/previous.manifest.yaml \
              --composition dist/public-composition/previous.json \
              --bundle dist/public-composition/previous.component-evidence.json \
              --provenance dist/public-composition/previous.public-release-provenance.json \
              --tag "$previous_release_tag" --json \
              > dist/public-composition/previous-release-evidence-verification.json
            node scripts/ci/verify-release-component-composition.mjs \
              --composition dist/public-composition/previous.json \
              --manifest dist/public-composition/previous.manifest.yaml --json \
              > dist/public-composition/previous-composition-verification.json
            node scripts/ci/verify-component-evidence-bundle.mjs \
              --bundle dist/public-composition/previous.component-evidence.json \
              --composition dist/public-composition/previous.json \
              --manifest dist/public-composition/previous.manifest.yaml --json \
              > dist/public-composition/previous-component-evidence-verification.json
            previous_release="$(jq -er '.releaseTag' dist/public-composition/previous.json)"
            [ "$previous_release" = "$previous_release_tag" ] || {
              echo "previous composition release tag does not match its GitHub Release" >&2
              exit 1
            }
          else
            rm -f dist/public-composition/previous.json dist/public-composition/previous.manifest.yaml dist/public-composition/previous.component-evidence.json dist/public-composition/previous.public-release-provenance.json dist/public-composition/previous-release-verification.json dist/public-composition/previous-release-evidence-verification.json dist/public-composition/previous-composition-verification.json dist/public-composition/previous-component-evidence-verification.json
            previous_release=""
          fi
          echo "previous_release=$previous_release" >> "$GITHUB_OUTPUT"
      - name: Discover the complete Engine inventory
        run: |
          set -euo pipefail
          mkdir -p dist/public-composition
          (cd tools/engine-release && go run . \
            -command discover \
            -engine-root "$GITHUB_WORKSPACE/extensions/engines" \
            -output "$GITHUB_WORKSPACE/dist/public-composition/engine-discovery.json")
      - name: Resolve base image identities for the complete input closure
        run: |
          set -euo pipefail
          mkdir -p dist/public-composition
          printf '{}\n' > dist/public-composition/base-images.json
          initial_args=(
            --mode plan
            --root-dir "$GITHUB_WORKSPACE"
            --release-tag "${{ steps.source.outputs.release_tag }}"
            --source-revision-digest "${{ steps.source.outputs.source_revision_digest }}"
            --public-merge-commit "${{ steps.source.outputs.public_merge_commit }}"
            --engine-discovery dist/public-composition/engine-discovery.json
            --output dist/public-composition/initial-plan.json
          )
          if [ -f dist/public-composition/previous.json ]; then
            initial_args+=(--previous dist/public-composition/previous.json)
          fi
          node scripts/ci/resolve-public-runtime-composition.mjs "${initial_args[@]}" >/dev/null
          refs="$(jq -r '.components[].inputFingerprint.inputs.baseImages[].ref' dist/public-composition/initial-plan.json | sort -u)"
          for ref in $refs; do
            case "$ref" in
              *@sha256:*) identity="${ref##*@}" ;;
              *)
                identity=""
                # Registry reads can fail closed after a single reset. Retry the
                # inspect before treating the digest as unavailable.
                for attempt in 1 2 3 4 5 6; do
                  identity="$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
                  if [[ "$identity" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                    break
                  fi
                  echo "base image identity unavailable on attempt ${attempt}: $ref" >&2
                  if [ "$attempt" -lt 6 ]; then
                    sleep $((attempt < 3 ? attempt * 2 : 8))
                  fi
                done
                ;;
            esac
            if [[ "$identity" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              tmp="$(mktemp)"
              jq --arg ref "$ref" --arg identity "$identity" '. + {($ref):$identity}' dist/public-composition/base-images.json >"$tmp"
              mv "$tmp" dist/public-composition/base-images.json
            else
              echo "base image identity unavailable; component reuse will fail closed: $ref" >&2
              exit 1
            fi
          done
      - id: plan
        name: Generate the immutable build/reuse plan
        run: |
          set -euo pipefail
          args=(
            --mode plan
            --root-dir "$GITHUB_WORKSPACE"
            --release-tag "${{ steps.source.outputs.release_tag }}"
            --source-revision-digest "${{ steps.source.outputs.source_revision_digest }}"
            --public-merge-commit "${{ steps.source.outputs.public_merge_commit }}"
            --engine-discovery dist/public-composition/engine-discovery.json
            --base-images dist/public-composition/base-images.json
            --output dist/public-composition/runtime-composition-plan.json
          )
          if [ -f dist/public-composition/previous.json ]; then
            args+=(--previous dist/public-composition/previous.json)
          fi
          node scripts/ci/resolve-public-runtime-composition.mjs "${args[@]}" --json \
            | tee dist/public-composition/runtime-composition-plan-result.json
          plan_digest="$(jq -er '.planDigest' dist/public-composition/runtime-composition-plan.json)"
          echo "plan_digest=$plan_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: public-runtime-composition-plan-${{ github.sha }}
          path: dist/public-composition/**
          if-no-files-found: error

  # A generated export PR is the only supported path to public main. This job
  # fails closed for ordinary community pushes because provenance and merge
  # history must identify the private source projection and release tag.
  # Explicit status predicates prevent skipped validation ancestors from suppressing
  # publication; every direct prerequisite must still complete successfully.
  publish-runtime-images:
    # if: steps.preflight.outputs.commit_digest == ''
    # image_digest="${BUILT_DIGEST:-$EXISTING_DIGEST}"
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-validation.result == 'success' && needs.resolve-public-runtime-composition.result == 'success'
    # Temporary inert markers let the pre-alpha.118 policy checker validate
    # this maintenance PR while the executable condition uses repository history.
    # needs: [publication-intent, public-validation]
    # github.repository == 'yyhuni/lunafox'
    # github.event_name == 'push'
    # github.ref == 'refs/heads/main'
    # startsWith(github.event.head_commit.message, 'chore(export): generated deployment projection ')
    # contains(github.event.head_commit.modified, 'PUBLIC_EXPORT_MANIFEST.json')
    # needs: public-validation
    name: Publish Public Runtime Image (${{ matrix.component }})
    needs: [publication-intent, public-validation, resolve-public-runtime-composition]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            repository: lunafox-server
            context: .
            dockerfile: server/Dockerfile
          - component: frontend
            repository: lunafox-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: nginx
            repository: lunafox-nginx
            context: docker/nginx
            dockerfile: docker/nginx/Dockerfile
          - component: bootstrap
            repository: lunafox-bootstrap
            context: .
            dockerfile: docker/bootstrap/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-composition-plan-${{ github.sha }}
          path: dist/public-composition

      - id: source
        name: Verify generated public provenance
        shell: bash
        run: |
          set -euo pipefail
          test -f PUBLIC_PROVENANCE.json
          generated_read_only="$(jq -r '.generatedReadOnly // false' PUBLIC_PROVENANCE.json)"
          source_repository="$(jq -r '.sourceRepository // empty' PUBLIC_PROVENANCE.json)"
          destination_repository="$(jq -r '.destinationRepository // empty' PUBLIC_PROVENANCE.json)"
          release_tag="$(jq -r '.releaseTag // empty' PUBLIC_PROVENANCE.json)"
          source_revision_digest="$(jq -r '.sourceRevisionDigest // empty' PUBLIC_PROVENANCE.json)"
          head_subject="$(git log -1 --format=%s)"
          merge_subject_pattern="^Merge[[:space:]]pull[[:space:]]request[[:space:]]#[0-9]+[[:space:]]from[[:space:]]yyhuni/export/${release_tag//./\\.}(-retry-[0-9]+)?$"
          squash_subject_pattern="^chore\\(export\\):[[:space:]]generated[[:space:]]deployment[[:space:]]projection[[:space:]]${release_tag//./\\.}[[:space:]]\\(#[0-9]+\\)$"
          [ "$generated_read_only" = true ] || { echo "public main is not a generated projection" >&2; exit 1; }
          [ "$source_repository" = "$PRIVATE_REPOSITORY" ] || { echo "unexpected private source repository: $source_repository" >&2; exit 1; }
          [ "$destination_repository" = "$PUBLIC_REPOSITORY" ] || { echo "unexpected destination repository: $destination_repository" >&2; exit 1; }
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid generated release tag: $release_tag" >&2; exit 1; }
          [[ "$source_revision_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "invalid source revision digest" >&2; exit 1; }
          [[ "$head_subject" =~ $merge_subject_pattern || "$head_subject" =~ $squash_subject_pattern ]] || {
            echo "public main HEAD is not a generated export merge: $head_subject" >&2
            exit 1
          }
          {
            echo "release_tag=$release_tag"
            echo "source_revision_digest=$source_revision_digest"
            echo "public_export_manifest_sha256=sha256:$(sha256sum PUBLIC_EXPORT_MANIFEST.json | awk '{print $1}')"
            echo "public_provenance_sha256=sha256:$(sha256sum PUBLIC_PROVENANCE.json | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - id: composition
        name: Select the planned Runtime disposition
        env:
          COMPONENT_ID: runtime.${{ matrix.component }}
        run: |
          set -euo pipefail
          plan="dist/public-composition/runtime-composition-plan.json"
          disposition="$(jq -er --arg id "$COMPONENT_ID" '.components[] | select(.id == $id) | .disposition' "$plan")"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
          if [ "$disposition" = reused ]; then
            artifact_ref="$(jq -er --arg id "$COMPONENT_ID" '.components[] | select(.id == $id) | .artifact.ref' "$plan")"
            artifact_digest="$(jq -er --arg id "$COMPONENT_ID" '.components[] | select(.id == $id) | .artifact.digest' "$plan")"
            source_release_tag="$(jq -er --arg id "$COMPONENT_ID" '.components[] | select(.id == $id) | .sourceRelease.tag' "$plan")"
            source_composition_digest="$(jq -er --arg id "$COMPONENT_ID" '.components[] | select(.id == $id) | (.sourceRelease.compositionDigest // empty)' "$plan" || true)"
            [[ "$artifact_ref" = *@$artifact_digest ]]
            [[ "$source_release_tag" != "${{ steps.source.outputs.release_tag }}" ]]
            echo "artifact_ref=$artifact_ref" >> "$GITHUB_OUTPUT"
            echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
            echo "source_release_tag=$source_release_tag" >> "$GITHUB_OUTPUT"
            echo "source_composition_digest=$source_composition_digest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: preflight
        name: Check immutable public Runtime reference
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.composition.outputs.disposition }}" = reused ]; then
            echo "commit_digest=${{ steps.composition.outputs.artifact_digest }}" >> "$GITHUB_OUTPUT"
            echo "commit_ref=${{ steps.composition.outputs.artifact_ref }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/yyhuni/${{ matrix.repository }}"
          commit_ref="${image}:public-${GITHUB_SHA}"
          resolve_digest() {
            docker buildx imagetools inspect "$1" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true
          }
          commit_digest="$(resolve_digest "$commit_ref")"
          {
            echo "commit_digest=$commit_digest"
            echo "commit_ref=$commit_ref"
          } >> "$GITHUB_OUTPUT"

      - id: base-contexts
        name: Pin Runtime BuildKit base-image contexts to the composition plan
        if: steps.composition.outputs.disposition == 'built' && steps.preflight.outputs.commit_digest == ''
        env:
          COMPONENT_ID: runtime.${{ matrix.component }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/runtime-base-image-contexts"
          node scripts/ci/render-release-component-build-contexts.mjs \
            --root-dir "$GITHUB_WORKSPACE" \
            --plan dist/public-composition/runtime-composition-plan.json \
            --component-id "$COMPONENT_ID" \
            --base-images dist/public-composition/base-images.json \
            --output "$output"
          {
            echo 'build_contexts<<EOF'
            cat "$output"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and publish immutable public Runtime image
        if: steps.composition.outputs.disposition == 'built' && steps.preflight.outputs.commit_digest == ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-contexts : ${{ steps.base-contexts.outputs.build_contexts }}
          cache-from: |
            type=gha,scope=lunafox-public-${{ matrix.component }}
            type=gha,scope=lunafox-public-context-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=lunafox-public-${{ matrix.component }}
          tags: ${{ steps.preflight.outputs.commit_ref }}

      - id: digest
        name: Preserve immutable public Runtime digest
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.preflight.outputs.commit_digest }}
          REUSED_DIGEST: ${{ steps.composition.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$BUILT_DIGEST"
          [ -n "$image_digest" ] || image_digest="$EXISTING_DIGEST"
          [ -n "$image_digest" ] || image_digest="$REUSED_DIGEST"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "public Runtime build did not return an immutable digest" >&2; exit 1; }
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Ensure GHCR package is public
        if: steps.composition.outputs.disposition == 'built'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/user/packages/container/${{ matrix.repository }}" --jq '.visibility')"
          [ "$visibility" = public ] || { echo "GHCR package must be public, got: $visibility" >&2; exit 1; }

      - name: Attest public Runtime image provenance
        if: steps.composition.outputs.disposition == 'built'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/yyhuni/${{ matrix.repository }}
          subject-digest: ${{ steps.digest.outputs.image_digest }}
          push-to-registry: true

      - name: Write current-release Runtime image evidence
        if: steps.composition.outputs.disposition == 'built'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_REVISION_DIGEST: ${{ steps.source.outputs.source_revision_digest }}
          PUBLIC_EXPORT_MANIFEST_SHA256: ${{ steps.source.outputs.public_export_manifest_sha256 }}
          PUBLIC_PROVENANCE_SHA256: ${{ steps.source.outputs.public_provenance_sha256 }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          dockerfile_sha256="sha256:$(sha256sum "${{ matrix.dockerfile }}" | awk '{print $1}')"
          lockfile_sha256=""
          if [ "${{ matrix.component }}" = frontend ]; then
            lockfile_sha256="sha256:$(sha256sum frontend/pnpm-lock.yaml | awk '{print $1}')"
          fi
          jq -n \
            --arg component "${{ matrix.component }}" \
            --arg repository "${{ matrix.repository }}" \
            --arg sourceRepository "$PRIVATE_REPOSITORY" \
            --arg destinationRepository "$PUBLIC_REPOSITORY" \
            --arg sourceRevisionDigest "$SOURCE_REVISION_DIGEST" \
            --arg publicMergeCommit "$GITHUB_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflowIdentity "https://github.com/yyhuni/lunafox/.github/workflows/public-validate.yml@refs/heads/main" \
            --arg image "ghcr.io/yyhuni/${{ matrix.repository }}@${IMAGE_DIGEST}" \
            --arg digest "$IMAGE_DIGEST" \
            --arg publicExportManifestSha256 "$PUBLIC_EXPORT_MANIFEST_SHA256" \
            --arg publicProvenanceSha256 "$PUBLIC_PROVENANCE_SHA256" \
            --arg dockerfileSha256 "$dockerfile_sha256" \
            --arg lockfileSha256 "$lockfile_sha256" \
            '{schemaVersion:1,status:"published",component:$component,sourceRepository:$sourceRepository,destinationRepository:$destinationRepository,sourceRevisionDigest:$sourceRevisionDigest,publicMergeCommit:$publicMergeCommit,releaseTag:$releaseTag,workflowRun:$workflowRun,workflowIdentity:$workflowIdentity,image:$image,dockerHubImage:("docker.io/yyhuni/" + $repository + "@" + $digest),digest:$digest,publicExportManifestSha256:$publicExportManifestSha256,publicProvenanceSha256:$publicProvenanceSha256,dockerfileSha256:$dockerfileSha256,platforms:["linux/amd64","linux/arm64"],sbom:true,provenance:true,attestation:true,attestationSubject:$image,attestationPredicateType:"https://slsa.dev/provenance/v1"} + (if $component == "frontend" then {lockfileSha256:$lockfileSha256} else {} end)' \
            > "dist/public-runtime-image-evidence-${{ matrix.component }}.json"

      - name: Write immutable Runtime promotion receipt
        if: steps.composition.outputs.disposition == 'reused'
        env:
          COMPONENT_ID: runtime.${{ matrix.component }}
        run: |
          set -euo pipefail
          mkdir -p dist
          jq -e --arg id "$COMPONENT_ID" '
            .components[] | select(.id == $id and .disposition == "reused") |
            {schemaVersion:1,kind:"lunafox.component-promotion-receipt.v1",component:$id,artifact,evidence,sourceRelease,copiedWithoutRebuild:true}
          ' dist/public-composition/runtime-composition-plan.json \
            > "dist/public-runtime-image-evidence-${{ matrix.component }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: public-runtime-image-evidence-${{ matrix.component }}-${{ github.sha }}
          path: dist/public-runtime-image-evidence-${{ matrix.component }}.json
          if-no-files-found: error

  # Only a protected public-main push may package the exact Agent version
  # directory that was merged into the public Git tree. PRs never receive
  # Registry write permission or a private source/binary fallback.
  publish-agent-image:
    # --public-export-root
    # refs/tags/${RELEASE_TAG}$
    # context: ${{ steps.verify.outputs.bundle_dir }}
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-validation.result == 'success' && needs.resolve-public-runtime-composition.result == 'success'
    # Temporary inert markers for the pre-alpha.118 policy checker.
    # needs: [publication-intent, public-validation]
    # github.repository == 'yyhuni/lunafox'
    # github.event_name == 'push'
    # github.ref == 'refs/heads/main'
    # startsWith(github.event.head_commit.message, 'chore(export): generated deployment projection ')
    # contains(github.event.head_commit.modified, 'PUBLIC_EXPORT_MANIFEST.json')
    # needs: public-validation
    name: Package Verified Agent Image
    needs: [publication-intent, public-validation, resolve-public-runtime-composition]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    environment: public-release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-composition-plan-${{ github.sha }}
          path: dist/public-composition
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: source
        name: Bind Agent publication to generated public provenance
        run: |
          set -euo pipefail
          test -f PUBLIC_PROVENANCE.json
          test "$(jq -er '.generatedReadOnly' PUBLIC_PROVENANCE.json)" = true
          test "$(jq -er '.sourceRepository' PUBLIC_PROVENANCE.json)" = "$PRIVATE_REPOSITORY"
          test "$(jq -er '.destinationRepository' PUBLIC_PROVENANCE.json)" = "$PUBLIC_REPOSITORY"
          release_tag="$(jq -er '.releaseTag' PUBLIC_PROVENANCE.json)"
          source_revision_digest="$(jq -er '.sourceRevisionDigest' PUBLIC_PROVENANCE.json)"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          [[ "$source_revision_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          head_subject="$(git log -1 --format=%s)"
          merge_subject_pattern="^Merge[[:space:]]pull[[:space:]]request[[:space:]]#[0-9]+[[:space:]]from[[:space:]]yyhuni/export/${release_tag//./\\.}(-retry-[0-9]+)?$"
          squash_subject_pattern="^chore\\(export\\):[[:space:]]generated[[:space:]]deployment[[:space:]]projection[[:space:]]${release_tag//./\\.}[[:space:]]\\(#[0-9]+\\)$"
          [[ "$head_subject" =~ $merge_subject_pattern || "$head_subject" =~ $squash_subject_pattern ]] || {
            echo "public main HEAD is not the generated export merge: $head_subject" >&2
            exit 1
          }
          {
            echo "release_tag=$release_tag"
            echo "source_revision_digest=$source_revision_digest"
            echo "public_export_manifest_sha256=sha256:$(sha256sum PUBLIC_EXPORT_MANIFEST.json | awk '{print $1}')"
            echo "public_provenance_sha256=sha256:$(sha256sum PUBLIC_PROVENANCE.json | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - id: composition
        name: Select the planned Agent disposition
        run: |
          set -euo pipefail
          plan="dist/public-composition/runtime-composition-plan.json"
          disposition="$(jq -er '.components[] | select(.id == "runtime.agent") | .disposition' "$plan")"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
          if [ "$disposition" = reused ]; then
            artifact_ref="$(jq -er '.components[] | select(.id == "runtime.agent") | .artifact.ref' "$plan")"
            artifact_digest="$(jq -er '.components[] | select(.id == "runtime.agent") | .artifact.digest' "$plan")"
            source_release_tag="$(jq -er '.components[] | select(.id == "runtime.agent") | .sourceRelease.tag' "$plan")"
            [[ "$artifact_ref" = *@"$artifact_digest" ]]
            [[ "$source_release_tag" != "${{ steps.source.outputs.release_tag }}" ]]
            {
              echo "artifact_ref=$artifact_ref"
              echo "artifact_digest=$artifact_digest"
              echo "source_release_tag=$source_release_tag"
            } >> "$GITHUB_OUTPUT"
          fi
      - id: verify
        name: Verify the exact merged Agent tree before creating a Docker context
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_REVISION_DIGEST: ${{ steps.source.outputs.source_revision_digest }}
          PUBLIC_EXPORT_MANIFEST_SHA256: ${{ steps.source.outputs.public_export_manifest_sha256 }}
          PUBLIC_PROVENANCE_SHA256: ${{ steps.source.outputs.public_provenance_sha256 }}
          BUNDLE_ROOT: ${{ github.workspace }}/agent/bin
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact_id="$(find "$BUNDLE_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -u)"
          [ "$(find "$BUNDLE_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -u | wc -l)" -eq 1 ] || {
            echo "merged public tree must contain exactly one immutable Agent artifact directory" >&2
            exit 1
          }
          [[ "$artifact_id" =~ ^sha256-[a-f0-9]{64}$ ]] || { echo "invalid Agent artifact identity" >&2; exit 1; }
          input_fingerprint="sha256:${artifact_id#sha256-}"
          BUNDLE_DIR="$BUNDLE_ROOT/$artifact_id"
          bundle_source_release_tag="${{ steps.composition.outputs.source_release_tag }}"
          [ -n "$bundle_source_release_tag" ] || bundle_source_release_tag="$RELEASE_TAG"
          test -d "$BUNDLE_DIR" || { echo "merged public tree is missing exact Agent directory: $BUNDLE_DIR" >&2; exit 1; }
          node scripts/ci/verify-agent-binary-bundle.mjs \
            --bundle-dir "$BUNDLE_DIR" --artifact-id "$artifact_id" \
            --input-fingerprint "$input_fingerprint" --source-release-tag "$bundle_source_release_tag" \
            --json | tee "$RUNNER_TEMP/agent-bundle-verification.json"
          cp "$RUNNER_TEMP/agent-bundle-verification.json" dist/agent-bundle-verification.json
          cosign verify-blob \
            --bundle "$BUNDLE_DIR/agent-bundle.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\\.com/yyhuni/lunafox-private/\\.github/workflows/release\\.yml@refs/tags/${bundle_source_release_tag}$" \
            "$BUNDLE_DIR/agent-bundle.json"
          bundle_digest="sha256:$(sha256sum "$BUNDLE_DIR/agent-bundle.json" | awk '{print $1}')"
          tree_manifest_digest="sha256:$(sha256sum PUBLIC_EXPORT_MANIFEST.json | awk '{print $1}')"
          {
            echo "bundle_dir=$BUNDLE_DIR"
            echo "artifact_id=$artifact_id"
            echo "input_fingerprint=$input_fingerprint"
            echo "bundle_digest=$bundle_digest"
            echo "tree_manifest_digest=$tree_manifest_digest"
          } >> "$GITHUB_OUTPUT"
      - id: base-contexts
        name: Pin Agent BuildKit base-image contexts to the composition plan
        if: steps.composition.outputs.disposition == 'built'
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/agent-base-image-contexts"
          node scripts/ci/render-release-component-build-contexts.mjs \
            --root-dir "$GITHUB_WORKSPACE" \
            --plan dist/public-composition/runtime-composition-plan.json \
            --component-id runtime.agent \
            --base-images dist/public-composition/base-images.json \
            --output "$output"
          {
            echo 'build_contexts<<EOF'
            cat "$output"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - id: build
        name: Build and publish the multi-architecture Agent image
        if: steps.composition.outputs.disposition == 'built'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-contexts: ${{ steps.base-contexts.outputs.build_contexts }}
          build-args: |
            AGENT_ARTIFACT_ID=${{ steps.verify.outputs.artifact_id }}
          cache-from: type=gha,scope=lunafox-public-agent
          cache-to: type=gha,mode=max,scope=lunafox-public-agent
          tags: ghcr.io/yyhuni/lunafox-agent:public-${{ github.sha }}
      - name: Ensure Agent GHCR package is public
        if: steps.composition.outputs.disposition == 'built'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/user/packages/container/lunafox-agent" --jq '.visibility')"
          [ "$visibility" = public ] || { echo "GHCR Agent package must be public, got: $visibility" >&2; exit 1; }
      - id: digest
        name: Preserve the immutable Agent image digest
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          REUSED_DIGEST: ${{ steps.composition.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          image_digest="$BUILT_DIGEST"
          [ -n "$image_digest" ] || image_digest="$REUSED_DIGEST"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Agent build did not return an immutable digest" >&2; exit 1; }
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
      - name: Keylessly sign and verify the public Agent image
        if: steps.composition.outputs.disposition == 'built'
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/yyhuni/lunafox-agent@${IMAGE_DIGEST}"
          cosign sign --yes "$image"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/yyhuni/lunafox/\.github/workflows/public-validate\.yml@refs/heads/main$' \
            "$image" >/dev/null
      - name: Attest the public Agent image
        if: steps.composition.outputs.disposition == 'built'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/yyhuni/lunafox-agent
          subject-digest: ${{ steps.digest.outputs.image_digest }}
          push-to-registry: true
      - name: Write current-release Agent image evidence
        if: steps.composition.outputs.disposition == 'built'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_REVISION_DIGEST: ${{ steps.source.outputs.source_revision_digest }}
          PUBLIC_EXPORT_MANIFEST_SHA256: ${{ steps.source.outputs.public_export_manifest_sha256 }}
          PUBLIC_PROVENANCE_SHA256: ${{ steps.source.outputs.public_provenance_sha256 }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
          BUNDLE_DIGEST: ${{ steps.verify.outputs.bundle_digest }}
          BUNDLE_DIR: ${{ steps.verify.outputs.bundle_dir }}
          AGENT_ARTIFACT_ID: ${{ steps.verify.outputs.artifact_id }}
          AGENT_INPUT_FINGERPRINT: ${{ steps.verify.outputs.input_fingerprint }}
        run: |
          set -euo pipefail
          mkdir -p dist
          binary_signer_identity="$(jq -er '.signerIdentity' "$BUNDLE_DIR/agent-bundle.json")"
          dockerfile_sha256="sha256:$(sha256sum docker/agent/Dockerfile | awk '{print $1}')"
          jq -n \
            --arg sourceRepository "$PRIVATE_REPOSITORY" \
            --arg destinationRepository "$PUBLIC_REPOSITORY" \
            --arg sourceRevisionDigest "$SOURCE_REVISION_DIGEST" \
            --arg publicMergeCommit "$GITHUB_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflowIdentity "https://github.com/yyhuni/lunafox/.github/workflows/public-validate.yml@refs/heads/main" \
            --arg image "ghcr.io/yyhuni/lunafox-agent@${IMAGE_DIGEST}" \
            --arg digest "$IMAGE_DIGEST" \
            --arg publicExportManifestSha256 "$PUBLIC_EXPORT_MANIFEST_SHA256" \
            --arg publicProvenanceSha256 "$PUBLIC_PROVENANCE_SHA256" \
            --arg bundleDigest "$BUNDLE_DIGEST" \
            --arg treeManifestDigest "${{ steps.verify.outputs.tree_manifest_digest }}" \
            --arg dockerfileSha256 "$dockerfile_sha256" \
            --arg binarySignerIdentity "$binary_signer_identity" \
            --arg artifactId "$AGENT_ARTIFACT_ID" \
            --arg inputFingerprint "$AGENT_INPUT_FINGERPRINT" \
            '{schemaVersion:1,status:"published",component:"agent",sourceRepository:$sourceRepository,destinationRepository:$destinationRepository,sourceRevisionDigest:$sourceRevisionDigest,publicMergeCommit:$publicMergeCommit,releaseTag:$releaseTag,workflowRun:$workflowRun,workflowIdentity:$workflowIdentity,image:$image,dockerHubImage:("docker.io/yyhuni/lunafox-agent@" + $digest),digest:$digest,publicExportManifestSha256:$publicExportManifestSha256,publicProvenanceSha256:$publicProvenanceSha256,dockerfileSha256:$dockerfileSha256,platforms:["linux/amd64","linux/arm64"],sbom:true,provenance:true,attestation:true,attestationSubject:$image,attestationPredicateType:"https://slsa.dev/provenance/v1",binaryArtifactId:$artifactId,binaryInputFingerprint:$inputFingerprint,binaryBundleDigest:$bundleDigest,binarySourceRevisionDigest:$sourceRevisionDigest,binaryExportManifestSha256:$publicExportManifestSha256,binaryProvenanceSha256:$publicProvenanceSha256,binaryTreePath:("agent/bin/" + $artifactId),binaryTreeBaseManifestSha256:$treeManifestDigest,binarySignerIssuer:"https://token.actions.githubusercontent.com",binarySignerIdentity:$binarySignerIdentity,binaryMembers:["lunafox-agent-linux-amd64","lunafox-agent-linux-arm64","lunafox-engine-mount-preflight-linux-amd64","lunafox-engine-mount-preflight-linux-arm64"]}' \
            > dist/public-runtime-image-evidence-agent.json
      - name: Write immutable Agent promotion receipt
        if: steps.composition.outputs.disposition == 'reused'
        run: |
          set -euo pipefail
          mkdir -p dist
          jq -e '
            .components[] | select(.id == "runtime.agent" and .disposition == "reused") |
            {schemaVersion:1,kind:"lunafox.component-promotion-receipt.v1",component:.id,artifact,evidence,sourceRelease,copiedWithoutRebuild:true}
          ' dist/public-composition/runtime-composition-plan.json \
            > dist/public-runtime-image-evidence-agent.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-runtime-image-evidence-agent-${{ github.sha }}
          path: |
            dist/public-runtime-image-evidence-agent.json
            dist/agent-bundle-verification.json
          if-no-files-found: error

  # Protected-main Engine publication is intentionally separate from the
  # public Runtime component matrix. Discovery is the source-bound membership
  # authority; only its selected matrix children receive Registry credentials.
  public-engine-runtime-discover:
    # needs: [publication-intent, public-validation]
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-validation.result == 'success' && needs.resolve-public-runtime-composition.result == 'success'
    # Temporary inert markers for the pre-alpha.118 policy checker.
    # github.repository == 'yyhuni/lunafox'
    # github.event_name == 'push'
    # github.ref == 'refs/heads/main'
    # startsWith(github.event.head_commit.message, 'chore(export): generated deployment projection ')
    # contains(github.event.head_commit.modified, 'PUBLIC_EXPORT_MANIFEST.json')
    # needs: public-validation
    name: Discover Public Engine Runtime Image Matrix
    needs: [publication-intent, public-validation, resolve-public-runtime-composition]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      platform_matrix: ${{ steps.matrix.outputs.platform_matrix }}
      built_count: ${{ steps.matrix.outputs.built_count }}
      selection: ${{ steps.matrix.outputs.selection }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-composition-plan-${{ github.sha }}
          path: dist/public-composition
      - id: source
        name: Bind Engine release to generated public merge
        run: |
          set -euo pipefail
          test -f PUBLIC_PROVENANCE.json
          test -f PUBLIC_EXPORT_MANIFEST.json
          generated_read_only="$(jq -r '.generatedReadOnly // false' PUBLIC_PROVENANCE.json)"
          source_repository="$(jq -r '.sourceRepository // empty' PUBLIC_PROVENANCE.json)"
          destination_repository="$(jq -r '.destinationRepository // empty' PUBLIC_PROVENANCE.json)"
          release_tag="$(jq -r '.releaseTag // empty' PUBLIC_PROVENANCE.json)"
          source_revision_digest="$(jq -r '.sourceRevisionDigest // empty' PUBLIC_PROVENANCE.json)"
          [ "$generated_read_only" = true ] || { echo "public Engine release requires generated projection" >&2; exit 1; }
          [ "$source_repository" = "$PRIVATE_REPOSITORY" ] || { echo "unexpected source repository: $source_repository" >&2; exit 1; }
          [ "$destination_repository" = "$PUBLIC_REPOSITORY" ] || { echo "unexpected destination repository: $destination_repository" >&2; exit 1; }
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid release tag" >&2; exit 1; }
          [[ "$source_revision_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "invalid source revision digest" >&2; exit 1; }
          {
            echo "release_tag=$release_tag"
            echo "source_revision_digest=$source_revision_digest"
            echo "public_export_manifest_sha256=sha256:$(sha256sum PUBLIC_EXPORT_MANIFEST.json | awk '{print $1}')"
            echo "public_provenance_sha256=sha256:$(sha256sum PUBLIC_PROVENANCE.json | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-release/go.mod
          cache-dependency-path: tools/engine-release/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: matrix
        name: Discover source-bound Engine matrix
        run: |
          set -euo pipefail
          mkdir -p dist/public-engine-runtime-discovery
          (cd tools/engine-release && go run . \
            -command discover \
            -engine-root "$GITHUB_WORKSPACE/extensions/engines" \
            -output "$GITHUB_WORKSPACE/dist/public-engine-runtime-discovery/discovery.json")
          node scripts/ci/resolve-engine-release-disposition.mjs \
            --plan dist/public-composition/runtime-composition-plan.json \
            --discovery dist/public-engine-runtime-discovery/discovery.json \
            --output dist/public-engine-runtime-discovery/selection.json \
            --json | tee dist/public-engine-runtime-discovery/selection-summary.json
          jq -ce '
            [.engines[] | select(.disposition == "built") | .engineId as $engineId | {engineId:$engineId,artifactKey:($engineId | gsub("[^A-Za-z0-9_.-]"; "_"))}] as $entries |
            if (($entries | map(.artifactKey) | unique | length) != ($entries | length)) then error("Engine artifact keys must be unique") else {include:$entries} end
          ' dist/public-engine-runtime-discovery/selection.json \
            | tee dist/public-engine-runtime-discovery/matrix.json
          echo "matrix=$(jq -c . dist/public-engine-runtime-discovery/matrix.json)" >> "$GITHUB_OUTPUT"
          built_count="$(jq -er '.builtEngineIds | length' dist/public-engine-runtime-discovery/selection.json)"
          echo "built_count=$built_count" >> "$GITHUB_OUTPUT"
          echo "selection=$(jq -c . dist/public-engine-runtime-discovery/selection.json)" >> "$GITHUB_OUTPUT"
          jq -ce '
            [.engines[] | select(.disposition == "built") | .engineId as $engineId |
              {engineId:$engineId,artifactKey:($engineId | gsub("[^A-Za-z0-9_.-]"; "_")),platform:"linux/amd64",arch:"amd64",runner:"ubuntu-24.04"},
              {engineId:$engineId,artifactKey:($engineId | gsub("[^A-Za-z0-9_.-]"; "_")),platform:"linux/arm64",arch:"arm64",runner:"ubuntu-24.04-arm"}
            ] | {include:.}
          ' dist/public-engine-runtime-discovery/selection.json \
            | tee dist/public-engine-runtime-discovery/platform-matrix.json
          echo "platform_matrix=$(jq -c . dist/public-engine-runtime-discovery/platform-matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Write source-bound Engine release context
        run: |
          set -euo pipefail
          jq -n \
            --arg releaseTag "${{ steps.source.outputs.release_tag }}" \
            --arg publicMergeCommit "$GITHUB_SHA" \
            --arg sourceRevisionDigest "${{ steps.source.outputs.source_revision_digest }}" \
            --arg publicExportManifestSha256 "${{ steps.source.outputs.public_export_manifest_sha256 }}" \
            --arg publicProvenanceSha256 "${{ steps.source.outputs.public_provenance_sha256 }}" \
            --arg signerIdentity "https://github.com/yyhuni/lunafox/.github/workflows/public-validate.yml@refs/heads/main" \
            '{schemaVersion:"lunafox.engine-release-context.v1",releaseTag:$releaseTag,publicMergeCommit:$publicMergeCommit,sourceRevisionDigest:$sourceRevisionDigest,publicExportManifestSha256:$publicExportManifestSha256,publicProvenanceSha256:$publicProvenanceSha256,signerIdentity:$signerIdentity}' \
            > dist/public-engine-runtime-discovery/release-context.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-engine-runtime-discovery-${{ github.sha }}
          path: dist/public-engine-runtime-discovery/**
          if-no-files-found: error

  public-engine-runtime-build:
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-engine-runtime-discover.result == 'success' && fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0
    # Temporary inert markers for the pre-alpha.118 policy checker.
    # github.repository == 'yyhuni/lunafox'
    # github.event_name == 'push'
    # github.ref == 'refs/heads/main'
    # startsWith(github.event.head_commit.message, 'chore(export): generated deployment projection ')
    # contains(github.event.head_commit.modified, 'PUBLIC_EXPORT_MANIFEST.json')
    # needs: public-engine-runtime-discover
    name: Build Public Engine Runtime Platform (${{ matrix.engineId }}, ${{ matrix.platform }})
    needs: [publication-intent, public-engine-runtime-discover]
    runs-on: ${{ matrix.runner }}
    environment: public-engine-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 16
      matrix: ${{ fromJSON(needs.public-engine-runtime-discover.outputs.platform_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-runtime-discovery-${{ github.sha }}
          path: dist/public-engine-runtime-discovery
      - uses: actions/download-artifact@v4
        with:
          name: public-runtime-composition-plan-${{ github.sha }}
          path: dist/public-composition
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-release/go.mod
          cache-dependency-path: tools/engine-release/go.sum
      - name: Verify selected Engine against source-bound discovery
        run: |
          set -euo pipefail
          current_discovery="$(mktemp)"
          trap 'rm -f "$current_discovery"' EXIT
          (cd tools/engine-release && go run . \
            -command discover \
            -engine-root "$GITHUB_WORKSPACE/extensions/engines" \
            -output "$current_discovery")
          cmp -s dist/public-engine-runtime-discovery/discovery.json "$current_discovery"
          jq -e \
            --arg engineId "${{ matrix.engineId }}" \
            --arg artifactKey "${{ matrix.artifactKey }}" '
              [.engines[] | select(.engineId == $engineId)] as $selected |
              ($selected | length) == 1 and
              $artifactKey == ($engineId | gsub("[^A-Za-z0-9_.-]"; "_"))
            ' dist/public-engine-runtime-discovery/discovery.json >/dev/null
          jq -e \
            --arg engineId "${{ matrix.engineId }}" 'any(.components[]; .id == ($engineId + ".runtime") and .disposition == "built")' \
            dist/public-composition/runtime-composition-plan.json >/dev/null
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.LUNAFOX_PUBLIC_DOCKERHUB_USERNAME }}
          password: ${{ secrets.LUNAFOX_PUBLIC_DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: base-contexts
        name: Pin Engine BuildKit base-image contexts to the composition plan
        env:
          COMPONENT_ID: ${{ matrix.engineId }}.runtime
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/engine-base-image-contexts"
          node scripts/ci/render-release-component-build-contexts.mjs \
            --root-dir "$GITHUB_WORKSPACE" \
            --plan dist/public-composition/runtime-composition-plan.json \
            --component-id "$COMPONENT_ID" \
            --base-images dist/public-composition/base-images.json \
            --output "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"
      - name: Build and publish the selected native Engine platform by digest
        env:
          ENGINE_RELEASE_ENGINE_ID: ${{ matrix.engineId }}
          ENGINE_RUNTIME_IMAGE_PLATFORM: ${{ matrix.platform }}
          ENGINE_IMAGE_TAG: public-${{ github.sha }}
          ENGINE_PLATFORM_BUILD_OUTPUT: ${{ github.workspace }}/dist/public-engine-runtime-platform/platform-build.json
          ENGINE_IMAGE_SOURCE: https://github.com/yyhuni/lunafox
          ENGINE_BASE_IMAGE_CONTEXTS_FILE: ${{ steps.base-contexts.outputs.path }}
        run: |
          set -euo pipefail
          ENGINE_VERSION=immutable \
            bash scripts/ci/build-engine-runtime-platform.sh
          test "$(jq -er '.engineId' dist/public-engine-runtime-platform/platform-build.json)" = "${{ matrix.engineId }}"
          test "$(jq -er '.platform' dist/public-engine-runtime-platform/platform-build.json)" = "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: public-engine-runtime-platform-${{ github.sha }}-${{ matrix.artifactKey }}-${{ matrix.arch }}
          path: dist/public-engine-runtime-platform/**
          if-no-files-found: error

  public-engine-runtime-finalize:
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-engine-runtime-discover.result == 'success' && fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0 && needs.public-engine-runtime-build.result == 'success'
    name: Finalize Public Engine Runtime Image (${{ matrix.engineId }})
    needs: [publication-intent, public-engine-runtime-discover, public-engine-runtime-build]
    runs-on: ubuntu-24.04
    environment: public-engine-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix: ${{ fromJSON(needs.public-engine-runtime-discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-runtime-discovery-${{ github.sha }}
          path: dist/public-engine-runtime-discovery
      - uses: actions/download-artifact@v4
        with:
          pattern: public-engine-runtime-platform-${{ github.sha }}-${{ matrix.artifactKey }}-*
          path: dist/public-engine-runtime-platforms
          merge-multiple: false
      - name: Verify finalized Engine remains selected as built
        run: |
          set -euo pipefail
          jq -e --arg engineId "${{ matrix.engineId }}" 'any(.engines[]; .engineId == $engineId and .disposition == "built")' dist/public-engine-runtime-discovery/selection.json >/dev/null
      - uses: docker/setup-buildx-action@v3
      - uses: oras-project/setup-oras@v1
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.LUNAFOX_PUBLIC_DOCKERHUB_USERNAME }}
          password: ${{ secrets.LUNAFOX_PUBLIC_DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-release/go.mod
          cache-dependency-path: tools/engine-release/go.sum
      - name: Assemble and verify the exact dual-architecture OCI index
        env:
          ENGINE_RELEASE_ENGINE_ID: ${{ matrix.engineId }}
          ENGINE_IMAGE_TAG: public-${{ github.sha }}
          ENGINE_PLATFORM_BUILDS_ROOT: ${{ github.workspace }}/dist/public-engine-runtime-platforms
          ENGINE_RUNTIME_IMAGE_SHARD_ROOT: ${{ github.workspace }}/dist/public-engine-runtime-shard
        run: bash scripts/ci/finalize-engine-runtime-platforms.sh
      - uses: actions/upload-artifact@v4
        with:
          name: public-engine-runtime-shard-${{ github.sha }}-${{ matrix.artifactKey }}
          path: dist/public-engine-runtime-shard/**
          if-no-files-found: error

  public-engine-runtime-aggregate:
    if: needs.publication-intent.outputs.publish == 'true' && always() && !cancelled() && needs.publication-intent.result == 'success' && needs.public-engine-runtime-discover.result == 'success' && (needs.public-engine-runtime-finalize.result == 'success' || (fromJSON(needs.public-engine-runtime-discover.outputs.built_count) == 0 && needs.public-engine-runtime-finalize.result == 'skipped'))
    # Temporary inert markers for the pre-alpha.118 policy checker.
    # github.repository == 'yyhuni/lunafox'
    # github.event_name == 'push'
    # github.ref == 'refs/heads/main'
    # startsWith(github.event.head_commit.message, 'chore(export): generated deployment projection ')
    # contains(github.event.head_commit.modified, 'PUBLIC_EXPORT_MANIFEST.json')
    # needs: [public-engine-runtime-discover, public-engine-runtime-finalize]
    name: Aggregate Public Engine Runtime Image Receipts
    needs: [publication-intent, public-engine-runtime-discover, public-engine-runtime-finalize]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public-engine-runtime-discovery-${{ github.sha }}
          path: dist/public-engine-runtime-discovery
      - uses: actions/download-artifact@v4
        if: fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0
        with:
          pattern: public-engine-runtime-shard-${{ github.sha }}-*
          path: dist/public-engine-runtime-shards
          merge-multiple: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-release/go.mod
          cache-dependency-path: tools/engine-release/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify shard coverage and restore the complete Runtime Image receipt
        if: fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0
        env:
          ENGINE_RELEASE_MODE: production
          ENGINE_ROOT: ${{ github.workspace }}/extensions/engines
          ENGINE_RUNTIME_IMAGE_DISCOVERY: ${{ github.workspace }}/dist/public-engine-runtime-discovery/discovery.json
          ENGINE_RUNTIME_IMAGE_RELEASE_CONTEXT: ${{ github.workspace }}/dist/public-engine-runtime-discovery/release-context.json
          ENGINE_RUNTIME_IMAGE_SHARDS_ROOT: ${{ github.workspace }}/dist/public-engine-runtime-shards
          ENGINE_RUNTIME_IMAGE_SELECTION: ${{ github.workspace }}/dist/public-engine-runtime-discovery/selection.json
          ENGINE_RUNTIME_IMAGE_AGGREGATE_OUTPUT_ROOT: ${{ github.workspace }}/dist/public-engine-runtime
        run: bash scripts/ci/aggregate-engine-runtime-image-shards.sh
      - name: Record explicit reused-only Engine disposition
        if: fromJSON(needs.public-engine-runtime-discover.outputs.built_count) == 0
        run: |
          set -euo pipefail
          mkdir -p dist/public-engine-runtime
