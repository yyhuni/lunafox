      - uses: actions/download-artifact@v4
        if: fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0
        with:
          name: public-engine-runtime-evidence-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        if: fromJSON(needs.public-engine-runtime-discover.outputs.built_count) > 0
        with:
          name: public-engine-package-evidence-${{ github.sha }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/engine-release/go.mod
          cache-dependency-path: tools/engine-release/go.sum
      - name: Generate and verify the independent Engine manifest
        run: |
          set -euo pipefail
          context_file=dist/public-engine-runtime/release-context.json
          mkdir -p dist/public-engine-release
          args=(
            --plan dist/public-composition/runtime-composition-plan.json
            --release-context "$context_file"
            --output-dir dist/public-engine-release
          )
          if [ -f dist/public-composition/previous.component-evidence.json ]; then
            [ -f dist/public-composition/previous.json ] || { echo "previous composition is required with prior evidence" >&2; exit 1; }
            args+=(
              --previous-bundle dist/public-composition/previous.component-evidence.json
              --previous-composition dist/public-composition/previous.json
            )
            [ -f dist/public-composition/previous.manifest.yaml ] || {
              echo "previous manifest is required with prior Engine evidence" >&2
              exit 1
            }
            args+=(--previous-manifest dist/public-composition/previous.manifest.yaml)
          fi
          if [ "$(jq -er '.builtEngineIds | length' dist/public-engine-runtime-discovery/selection.json)" -gt 0 ]; then
            args+=(
              --runtime-build-results dist/public-engine-runtime/build-results.json
              --package-build-results dist/public-engine-package-v2/build-results.json
              --package-digests-dir dist/public-engine-package-digests
              --runtime-evidence dist/public-engine-runtime-evidence/evidence.json
              --package-evidence dist/public-engine-package-evidence/evidence.json
            )
          fi
          node scripts/ci/assemble-public-engine-release.mjs "${args[@]}" --json \
            | tee dist/public-engine-release/assembly-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-engine-release
          path: dist/public-engine-release/**
          if-no-files-found: error

  # The protected public workflow is the only owner of the final product
