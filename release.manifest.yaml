    # v0.0.1-alpha.181
    
    ## English
    
    ### Improved
    
    - Improved scheduled scan configuration editing by surfacing schema validation errors and focusing the first invalid field.
    - Improved asset search and resource management by supporting partial URL, host, and title queries, preserving exact URL syntax, keeping empty wordlist tags after reload, and clarifying resource and selection-panel interactions.
    
    Full Changelog: https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.180...v0.0.1-alpha.181
    
    ## 简体中文
    
    ### 改进
    
    - 改进定时扫描配置编辑：显示 schema 校验错误并聚焦第一个无效字段。
    - 改进资产搜索和资源管理：支持 URL、主机和标题的模糊查询，保留 URL 精确匹配语法，修复空字典标签重新加载后的显示，并优化资源说明及选择栏交互。
    
    完整变更记录：https://github.com/yyhuni/lunafox/compare/v0.0.1-alpha.180...v0.0.1-alpha.181
